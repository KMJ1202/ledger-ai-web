<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<meta name="robots" content="noindex">
<title>Estimate</title>
<style>
:root{--bg:#07090d;--card:#10151c;--line:#1f2833;--text:#f3f5f7;--dim:#93a1af;--cyan:#22d3ee;--purple:#a855f7;--emerald:#34d399;--red:#f87171;--amber:#fbbf24}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center}
body::before{content:"";position:fixed;inset:-40%;background:
  radial-gradient(42% 34% at 22% 12%, rgba(34,211,238,.13), transparent 60%),
  radial-gradient(40% 34% at 82% 18%, rgba(168,85,247,.12), transparent 60%);
  pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;width:100%;max-width:560px;padding:34px 20px calc(env(safe-area-inset-bottom) + 44px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.biz{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.biz img{width:44px;height:44px;border-radius:10px;object-fit:cover}
.biz .name{font-size:18px;font-weight:700}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
h1{font-size:22px;margin:0}
.chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
.chip.open{color:var(--amber);border-color:rgba(251,191,36,.4)}
.chip.accepted{color:var(--emerald);border-color:rgba(52,211,153,.4)}
.chip.declined{color:var(--red);border-color:rgba(248,113,113,.4)}
.chip.converted{color:var(--purple);border-color:rgba(168,85,247,.4)}
.chip.expired{color:var(--dim)}
.meta{color:var(--dim);font-size:13px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 0;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;white-space:nowrap}
.desc{color:var(--dim);font-size:12px}
.totals td{border-bottom:none;padding:4px 0}
.totals .grand td{font-size:17px;font-weight:800;padding-top:10px}
.memo{margin-top:14px;color:var(--dim);font-size:13px;white-space:pre-wrap}
.respond{display:flex;gap:10px;margin-top:20px}
.respond button{flex:1;padding:15px;border:0;border-radius:13px;font-size:15px;font-weight:800;cursor:pointer}
.acceptbtn{color:var(--accent-text,#03242b);background:var(--accent-bg,linear-gradient(135deg,var(--emerald),#6ee7b7))}
.declinebtn{color:var(--red);background:transparent;border:1px solid rgba(248,113,113,.45) !important}
.respond button:disabled{opacity:.55}
.bizmeta{color:var(--dim);font-size:12px;margin-top:2px}
.footnote{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);color:var(--dim);font-size:12px;white-space:pre-wrap}
.banner{margin-top:18px;padding:14px;border-radius:12px;font-weight:700;text-align:center}
.banner.ok{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.4);color:var(--emerald)}
.banner.no{background:rgba(248,113,113,.10);border:1px solid rgba(248,113,113,.4);color:var(--red)}
.banner.info{background:rgba(147,161,175,.10);border:1px solid var(--line);color:var(--dim);font-weight:500;font-size:13px}
body.minimal{background:#f5f6f8;color:#14181d}
body.minimal::before{display:none}
body.minimal .card{background:#fff;border-color:#e2e6ea}
body.minimal .desc,body.minimal .meta,body.minimal .memo,body.minimal .bizmeta,body.minimal .footnote{color:#5b6672}
body.minimal td,body.minimal th{border-bottom-color:#eceff2}
body.minimal .footnote{border-top-color:#eceff2}
body.minimal .foot{color:#8a939c}
body.modern .biz{margin:-22px -22px 18px;padding:20px 22px;border-radius:17px 17px 0 0;background:linear-gradient(135deg,var(--accent-soft,rgba(34,211,238,.18)),transparent 130%);border-bottom:1px solid var(--line)}
.err{color:var(--red);text-align:center;padding:40px 0}
.foot{margin-top:22px;text-align:center;color:var(--dim);font-size:11px}
@media print{body{background:#fff;color:#000}body::before{display:none}.card{border:1px solid #ccc;background:#fff}.respond,.foot{display:none}.chip,.meta,.desc,.memo{color:#444}}
</style>
</head>
<body>
<div class="wrap"><div class="card" id="card"><div class="err">Loading…</div></div>
<div class="foot">Powered by Ledger AI</div></div>
<script>
const FN = "https://lbzkyyehmgudlxmfpzzh.supabase.co/functions/v1/books";
const params = new URLSearchParams(location.search);
const token = params.get("t") || "";
const card = document.getElementById("card");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cur = (n, c) => new Intl.NumberFormat("en-CA", {style:"currency", currency:c||"CAD"}).format(Number(n)||0);

function render(data, justResponded){
  const est = data.estimate, biz = data.business;
  const c = est.currency;
  // Owner branding: template picks the shell, accent recolors the action
  // surfaces. Text on the accent flips by luminance so any brand color reads.
  document.body.className = biz.template === "minimal" ? "minimal" : biz.template === "modern" ? "modern" : "";
  const accent = /^#[0-9a-fA-F]{6}$/.test(biz.accent_color || "") ? biz.accent_color : "";
  if (accent) {
    const [r, g, b] = [1, 3, 5].map((i) => parseInt(accent.slice(i, i + 2), 16));
    const rs = document.documentElement.style;
    rs.setProperty("--accent-bg", accent);
    rs.setProperty("--accent-text", (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? "#14181d" : "#ffffff");
    rs.setProperty("--accent-soft", `rgba(${r},${g},${b},.18)`);
  }
  const contact = [biz.address, biz.phone].filter(Boolean).join(" · ");
  const taxRows = (Array.isArray(est.taxes) && est.taxes.length ? est.taxes : (est.tax_total > 0 ? [{ name: est.tax_name, rate: est.tax_rate, total: est.tax_total }] : []))
    .filter((t) => t.total > 0)
    .map((t) => { const pct = Math.round(t.rate * 100000) / 1000; return `<tr><td>${esc(t.name || "Tax")} (${pct.toFixed(pct % 1 ? ((pct * 100) % 1 ? 3 : 2) : 0)}%)</td><td class="num">${cur(t.total, c)}</td></tr>`; }).join("");
  const chips = {open:["open","AWAITING YOUR RESPONSE"], accepted:["accepted","ACCEPTED"], declined:["declined","DECLINED"], converted:["converted","INVOICED"], expired:["expired","EXPIRED"]};
  const chip = chips[est.status] || ["expired", est.status.toUpperCase()];
  card.innerHTML = `
    <div class="biz">${biz.logo_url ? `<img src="${esc(biz.logo_url)}" alt="">` : ""}<div><div class="name">${esc(biz.name)}</div>${contact ? `<div class="bizmeta">${esc(contact)}</div>` : ""}</div></div>
    <div class="head"><h1>Estimate ${esc(est.number)}</h1><span class="chip ${chip[0]}">${chip[1]}</span></div>
    <div class="meta">${est.customer ? esc(est.customer.name) + (est.customer.company ? " · " + esc(est.customer.company) : "") + " · " : ""}Issued ${esc(est.issue_date)}${est.expiry_date ? " · Valid until " + esc(est.expiry_date) : ""}</div>
    <table><thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Amount</th></tr></thead><tbody>
    ${est.lines.map((l) => `<tr><td>${esc(l.name)}${l.description ? `<div class="desc">${esc(l.description)}</div>` : ""}</td><td class="num">${esc(l.quantity)}</td><td class="num">${cur(l.rate, c)}</td><td class="num">${cur(l.amount, c)}</td></tr>`).join("")}
    </tbody></table>
    <table class="totals"><tbody>
      <tr><td>Subtotal</td><td class="num">${cur(est.subtotal, c)}</td></tr>
      ${taxRows}
      <tr class="grand"><td>Total</td><td class="num">${cur(est.total, c)}</td></tr>
    </tbody></table>
    ${est.memo ? `<div class="memo">${esc(est.memo)}</div>` : ""}
    ${justResponded === "accepted" ? `<div class="banner ok">✓ Estimate accepted — we'll be in touch to get this scheduled.</div>` : ""}
    ${justResponded === "declined" ? `<div class="banner no">Estimate declined — thanks for letting us know.</div>` : ""}
    ${!justResponded && est.status === "accepted" ? `<div class="banner ok">✓ This estimate has been accepted.</div>` : ""}
    ${!justResponded && est.status === "declined" ? `<div class="banner no">This estimate was declined.</div>` : ""}
    ${!justResponded && est.status === "converted" ? `<div class="banner ok">✓ This estimate has been billed as an invoice.</div>` : ""}
    ${!justResponded && est.status === "expired" ? `<div class="banner info">This quote has expired — get in touch and we'll refresh the pricing for you.</div>` : ""}
    ${!justResponded && data.can_respond ? `<div class="respond"><button class="acceptbtn" id="accept">Accept estimate</button><button class="declinebtn" id="decline">Decline</button></div>` : ""}
    ${biz.footer_note ? `<div class="footnote">${esc(biz.footer_note)}</div>` : ""}
  `;
  const respond = async (choice, btn, other) => {
    btn.disabled = true; other.disabled = true; btn.textContent = "Sending…";
    try {
      const r = await fetch(FN, {method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({action:"estimate-respond", token, response: choice})});
      const d = await r.json();
      if (d.responded) render({...data, estimate: d.estimate, can_respond: false}, d.status);
      else { btn.textContent = d.error || "Something went wrong"; }
    } catch { btn.disabled = false; other.disabled = false; btn.textContent = "Try again"; }
  };
  const a = document.getElementById("accept"), dBtn = document.getElementById("decline");
  if (a && dBtn) {
    a.onclick = () => respond("accept", a, dBtn);
    dBtn.onclick = () => respond("decline", dBtn, a);
  }
}

(async () => {
  try {
    const r = await fetch(`${FN}?action=public-estimate&t=${encodeURIComponent(token)}`);
    if (!r.ok) throw new Error();
    render(await r.json(), null);
  } catch {
    card.innerHTML = `<div class="err">This estimate link isn't valid anymore.</div>`;
  }
})();
</script>
</body>
</html>
