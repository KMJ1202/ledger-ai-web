<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="robots" content="noindex">
<title>Book an appointment</title>
<style>
:root{--bg:#0b0f14;--card:#141a22;--line:#232c37;--text:#f3f5f7;--dim:#9aa6b2;--cyan:#22d3ee;--purple:#a855f7;--emerald:#34d399;--red:#f87171}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:520px;padding:28px 20px calc(env(safe-area-inset-bottom) + 40px)}
.biz{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.biz img{width:52px;height:52px;border-radius:13px;object-fit:cover;border:1px solid var(--line)}
.mark{width:52px;height:52px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;color:var(--cyan);background:linear-gradient(135deg,rgba(34,211,238,.22),rgba(168,85,247,.2));border:1px solid rgba(34,211,238,.35)}
h1{font-size:22px;margin:0}
.sub{color:var(--dim);font-size:14px;margin:4px 0 22px}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--dim);margin:16px 0 6px;text-transform:uppercase}
input,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--text);font-size:15px;padding:12px 14px;font-family:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--cyan)}
textarea{resize:vertical}
.btn{width:100%;margin-top:22px;padding:14px;border:0;border-radius:13px;font-size:16px;font-weight:700;color:#04262e;background:linear-gradient(135deg,var(--cyan),#67e8f9);cursor:pointer}
.btn:disabled{opacity:.55}
.err{color:var(--red);font-size:13.5px;margin-top:12px;display:none}
.done{display:none;text-align:center;padding-top:8vh}
.done .big{font-size:52px}
.done h2{font-size:21px;margin:14px 0 8px}
.done p{color:var(--dim);font-size:15px;line-height:1.5}
.foot{margin-top:auto;padding:18px;color:var(--dim);font-size:12px}
.foot a{color:var(--dim)}
.hp{position:absolute;left:-9999px;opacity:0;height:0;overflow:hidden}
#loading{color:var(--dim);padding-top:10vh;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div id="loading">Loading…</div>
  <div id="form" style="display:none">
    <div class="biz"><span id="logo" class="mark">L</span><h1 id="bizname"></h1></div>
    <p class="sub">Request an appointment — they'll get back to you to confirm a time.</p>
    <label for="fname">Your name</label><input id="fname" autocomplete="name" maxlength="160">
    <label for="fphone">Phone</label><input id="fphone" type="tel" autocomplete="tel" maxlength="40">
    <label for="femail">Email</label><input id="femail" type="email" autocomplete="email" maxlength="160">
    <label for="fservice">What do you need?</label><input id="fservice" maxlength="300" placeholder="e.g. 4 new tires installed, leaky faucet, haircut…">
    <label for="fwhen">Preferred day &amp; time</label><input id="fwhen" maxlength="200" placeholder="e.g. Tuesday morning, any weekday after 5">
    <label for="fnotes">Anything else?</label><textarea id="fnotes" rows="3" maxlength="2000"></textarea>
    <div class="hp"><label for="website">Website</label><input id="website" tabindex="-1" autocomplete="off"></div>
    <button class="btn" id="go">Send booking request</button>
    <p class="err" id="err"></p>
  </div>
  <div class="done" id="done">
    <div class="big">✅</div>
    <h2>Request sent!</h2>
    <p><span id="donebiz"></span> has your request and will reach out to confirm your appointment.</p>
  </div>
</div>
<p class="foot">Powered by <a href="https://heyledger.ai">Ledger AI</a></p>
<script>
const FN = "https://lbzkyyehmgudlxmfpzzh.supabase.co/functions/v1/bookings";
const slug = new URLSearchParams(location.search).get("b") || "";
const $ = (id) => document.getElementById(id);
let bizName = "";

async function load() {
  try {
    const r = await fetch(`${FN}/public?b=${encodeURIComponent(slug)}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "This booking link isn't active.");
    bizName = d.business;
    document.title = "Book with " + bizName;
    $("bizname").textContent = bizName;
    if (d.logo_url) $("logo").outerHTML = `<img src="${d.logo_url.replace(/"/g, "")}" alt="">`;
    $("loading").style.display = "none";
    $("form").style.display = "block";
  } catch (e) {
    $("loading").textContent = e.message;
  }
}

$("go").onclick = async () => {
  const err = $("err"); err.style.display = "none";
  const btn = $("go"); btn.disabled = true; btn.textContent = "Sending…";
  try {
    const r = await fetch(FN, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        action: "request", biz: slug,
        name: $("fname").value, phone: $("fphone").value, email: $("femail").value,
        service: $("fservice").value, preferred: $("fwhen").value, notes: $("fnotes").value,
        website: $("website").value,
      }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Something went wrong — please try again.");
    $("form").style.display = "none";
    $("donebiz").textContent = bizName;
    $("done").style.display = "block";
  } catch (e) {
    err.textContent = e.message; err.style.display = "block";
    btn.disabled = false; btn.textContent = "Send booking request";
  }
};
load();
</script>
</body>
</html>
