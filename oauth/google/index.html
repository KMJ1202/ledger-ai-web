<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0f14">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>Connecting Google — Ledger AI</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0f14;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .box{text-align:center;padding:24px}
  .box img{width:56px;height:56px;border-radius:14px;margin-bottom:14px}
  .box p{color:#9aa4b2;font-size:15px;margin:6px 0 0}
  .box a{color:#22d3ee}
</style>
</head>
<body>
<div class="box">
  <img src="/assets/logo-mark-96.png" alt="">
  <div><b>Finishing your Google connection…</b></div>
  <p id="msg">One moment.</p>
</div>
<script>
// Google sends the OAuth response here (a domain Ledger AI owns) and this page
// hands it straight to the Ledger AI server that completes the connection.
// Nothing is stored or read on this page; the query string is passed through as-is.
(function () {
  var q = location.search || "";
  var target = "https://lbzkyyehmgudlxmfpzzh.supabase.co/functions/v1/google-calendar/callback" + q;
  if (/[?&](code|error)=/.test(q)) {
    location.replace(target);
  } else {
    document.getElementById("msg").innerHTML =
      "This page only works as part of connecting Google from the Ledger AI app. " +
      '<a href="/app.html">Open the app</a>';
  }
})();
</script>
</body>
</html>
