<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<meta name="robots" content="noindex">
<title>Today's jobs</title>
<style>
:root{--bg:#07090d;--card:#10151c;--line:#1f2833;--text:#f3f5f7;--dim:#93a1af;--cyan:#22d3ee;--purple:#a855f7;--emerald:#34d399;--amber:#fbbf24;--red:#f87171}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-40%;background:
  radial-gradient(42% 34% at 22% 12%, rgba(34,211,238,.13), transparent 60%),
  radial-gradient(40% 34% at 82% 18%, rgba(168,85,247,.12), transparent 60%),
  radial-gradient(50% 40% at 50% 96%, rgba(34,211,238,.06), transparent 65%);
  animation:drift 26s ease-in-out infinite alternate;pointer-events:none;z-index:0}
@keyframes drift{from{transform:translate3d(-1.5%,-1%,0) scale(1)}to{transform:translate3d(1.5%,1.5%,0) scale(1.05)}}
.wrap{position:relative;z-index:1;width:100%;max-width:560px;padding:30px 18px calc(env(safe-area-inset-bottom) + 44px)}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:22px}
.ring{width:64px;height:64px;border-radius:20px;padding:2px;background:linear-gradient(135deg,var(--cyan),var(--purple));box-shadow:0 0 42px rgba(34,211,238,.35),0 0 90px rgba(168,85,247,.18);animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 34px rgba(34,211,238,.3),0 0 80px rgba(168,85,247,.15)}50%{box-shadow:0 0 52px rgba(34,211,238,.5),0 0 110px rgba(168,85,247,.28)}}
.ring>.inner{width:100%;height:100%;border-radius:18px;background:var(--card);display:flex;align-items:center;justify-content:center}
.ring .mono{font-weight:800;font-size:26px;background:linear-gradient(135deg,var(--cyan),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:23px;margin:16px 0 0;letter-spacing:-.02em}
.tagline{margin:6px 0 0;color:var(--dim);font-size:14px}
.badge{display:inline-flex;align-items:center;gap:7px;margin-top:12px;padding:6px 14px;border-radius:999px;border:1px solid rgba(34,211,238,.35);background:rgba(34,211,238,.08);color:var(--cyan);font-size:11.5px;font-weight:700;letter-spacing:.06em}
.badge .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,211,238,.5)}50%{box-shadow:0 0 0 6px rgba(34,211,238,0)}}
.job{position:relative;border-radius:22px;padding:1px;margin-bottom:16px;background:linear-gradient(160deg,rgba(34,211,238,.4),rgba(168,85,247,.28) 45%,rgba(34,211,238,.1));box-shadow:0 24px 70px rgba(0,0,0,.5)}
.job>.in{border-radius:21px;background:rgba(16,21,28,.92);backdrop-filter:blur(18px);padding:20px 18px 18px}
.job-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.job-time{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--cyan);text-transform:uppercase}
.job-title{font-size:18px;font-weight:800;margin:4px 0 0;letter-spacing:-.01em}
.statuspill{flex-shrink:0;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px;white-space:nowrap}
.job-loc{display:flex;align-items:center;gap:7px;margin-top:10px;color:var(--dim);font-size:13.5px;text-decoration:none}
.job-loc svg{flex-shrink:0}
.job-loc span{text-decoration:underline;text-decoration-color:rgba(147,161,175,.35);text-underline-offset:3px}
.navrow{display:flex;gap:9px;margin-top:12px}
.navbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 10px;border-radius:13px;font-size:13.5px;font-weight:800;letter-spacing:.02em;text-decoration:none;color:#03181d;background:linear-gradient(135deg,var(--cyan),#7dd3fc);box-shadow:0 8px 26px rgba(34,211,238,.28);transition:transform .15s}
.navbtn:active{transform:translateY(1px) scale(.99)}
.navbtn.alt{flex:0 0 auto;color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--line);box-shadow:none;padding:13px 14px;font-size:12px}
.job-details{margin-top:10px;color:var(--dim);font-size:13px;line-height:1.5;white-space:pre-wrap;padding:10px 12px;background:rgba(255,255,255,.035);border-radius:12px;border:1px solid var(--line)}
.job-details a{color:var(--cyan);text-decoration:none;font-weight:700}
.clockcard{position:relative;border-radius:22px;padding:1px;margin:0 0 16px;background:linear-gradient(160deg,rgba(52,211,153,.5),rgba(34,211,238,.3) 55%,rgba(52,211,153,.12));box-shadow:0 24px 70px rgba(0,0,0,.5)}
.clockcard.on{background:linear-gradient(160deg,rgba(251,191,36,.5),rgba(34,211,238,.28) 55%,rgba(251,191,36,.12))}
.clockcard>.in{border-radius:21px;background:rgba(16,21,28,.94);backdrop-filter:blur(18px);padding:17px 16px}
.clockrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.clocklabel{font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.clockdot{width:8px;height:8px;border-radius:50%}
.clocktime{font-size:30px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:3px}
.clocksub{color:var(--dim);font-size:12px;margin-top:3px}
.clockbtn{flex-shrink:0;padding:15px 20px;border:0;border-radius:15px;font-size:14px;font-weight:800;letter-spacing:.05em;cursor:pointer;transition:transform .15s}
.clockbtn:active{transform:translateY(1px) scale(.98)}
.clockbtn:disabled{opacity:.5}
.clockbtn.in{color:#03181d;background:linear-gradient(135deg,var(--emerald),#6ee7b7);box-shadow:0 10px 34px rgba(52,211,153,.35)}
.clockbtn.out{color:#1a1002;background:linear-gradient(135deg,var(--amber),#fcd34d);box-shadow:0 10px 34px rgba(251,191,36,.3)}
.daymeter{display:flex;align-items:center;gap:10px;margin:2px 0 18px;padding:13px 15px;border-radius:16px;background:rgba(52,211,153,.06);border:1px solid rgba(52,211,153,.25)}
.daymeter .bar{flex:1;height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.daymeter .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--emerald));box-shadow:0 0 12px rgba(52,211,153,.6);transition:width .5s ease}
.daymeter .count{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--emerald);white-space:nowrap}
.track{display:flex;align-items:center;gap:6px;margin-top:16px}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.step-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;border:1.5px solid var(--line);color:var(--dim);background:rgba(255,255,255,.03);transition:all .3s ease}
.step-label{font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.step-line{flex-shrink:0;width:100%;height:2px;background:var(--line);margin:0 -8px;transform:translateY(-15px);z-index:-1}
.step.done .step-dot{background:var(--emerald);border-color:var(--emerald);color:#03181d;box-shadow:0 0 16px rgba(52,211,153,.5)}
.step.done .step-label{color:var(--emerald)}
.step.current .step-dot{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 0 4px rgba(34,211,238,.12)}
.step.current .step-label{color:var(--cyan)}
.actionbtn{width:100%;margin-top:16px;padding:15px;border:0;border-radius:14px;font-size:15px;font-weight:800;letter-spacing:.01em;color:#03181d;background:linear-gradient(135deg,var(--cyan),#7dd3fc 60%,var(--purple));background-size:200% 100%;cursor:pointer;transition:transform .15s,box-shadow .2s,background-position .4s;box-shadow:0 10px 34px rgba(34,211,238,.25)}
.actionbtn:active{transform:translateY(1px) scale(.99)}
.actionbtn:disabled{opacity:.5}
.actionbtn.finished{background:linear-gradient(135deg,var(--emerald),#6ee7b7);box-shadow:0 10px 34px rgba(52,211,153,.25);cursor:default}
.tick-burst{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--emerald);font-weight:800;font-size:13px;letter-spacing:.05em;text-transform:uppercase;margin-top:16px;animation:rise .5s ease}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.empty{text-align:center;padding:14vh 20px;color:var(--dim)}
.empty h2{color:var(--text);font-size:19px;margin:14px 0 6px}
.foot{position:relative;z-index:1;margin-top:auto;padding:20px;color:#556270;font-size:12px;letter-spacing:.04em}
.foot a{color:var(--dim);text-decoration:none}
#loading{position:relative;z-index:1;color:var(--dim);padding-top:16vh;text-align:center}
.expired{display:none;text-align:center;padding-top:14vh;animation:rise .5s ease}
.expired .icon{width:88px;height:88px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.35);box-shadow:0 0 60px rgba(248,113,113,.15)}
.expired h2{font-size:21px;margin:20px 0 8px}
.expired p{color:var(--dim);font-size:14.5px;line-height:1.55;padding:0 20px}
</style>
</head>
<body>
<div class="wrap">
  <div id="loading">Loading…</div>

  <div id="app" style="display:none">
    <div class="hero">
      <div class="ring"><div class="inner"><span class="mono">L</span></div></div>
      <h1 id="greeting"></h1>
      <p class="tagline" id="bizline"></p>
      <span class="badge"><span class="dot"></span><span id="datebadge"></span></span>
    </div>
    <div id="clock"></div>
    <div id="jobs"></div>
  </div>

  <div class="expired" id="expired">
    <div class="icon">✕</div>
    <h2>Link expired</h2>
    <p id="expiredmsg">Ask the shop for a new one.</p>
  </div>
</div>
<p class="foot">Powered by <a href="https://heyledger.ai">Ledger AI</a></p>
<script>
const FN = "https://lbzkyyehmgudlxmfpzzh.supabase.co/functions/v1/crew";
const token = new URLSearchParams(location.search).get("t") || "";
const $ = (id) => document.getElementById(id);
const STEPS = [
  { key: "on_my_way", label: "On my way", icon: "🚗" },
  { key: "on_site", label: "On site", icon: "📍" },
  { key: "done", label: "Done", icon: "✓" },
];
let busy = false;
let refreshTimer = null;

function fmtTime(iso) {
  if (!iso) return "Time TBD";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "Time TBD";
  return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}

function statusIndex(status) {
  if (status === "done") return 2;
  if (status === "on_site") return 1;
  if (status === "on_my_way") return 0;
  return -1; // assigned
}

function statusPillColor(status) {
  if (status === "done") return { bg: "rgba(52,211,153,.12)", fg: "var(--emerald)" };
  if (status === "on_site") return { bg: "rgba(34,211,238,.12)", fg: "var(--cyan)" };
  if (status === "on_my_way") return { bg: "rgba(251,191,36,.12)", fg: "var(--amber)" };
  return { bg: "rgba(147,161,175,.12)", fg: "var(--dim)" };
}

function statusLabel(status) {
  if (status === "done") return "Done";
  if (status === "on_site") return "On site";
  if (status === "on_my_way") return "On my way";
  return "Not started";
}

function jobCard(job) {
  const idx = statusIndex(job.status);
  const pill = statusPillColor(job.status);
  const stepsHtml = STEPS.map((step, i) => {
    const cls = i <= idx ? "step done" : i === idx + 1 ? "step current" : "step";
    const dotContent = i <= idx ? "✓" : String(i + 1);
    return `<div class="${cls}">
      <div style="display:flex;align-items:center;width:100%">
        ${i > 0 ? '<div class="step-line"></div>' : '<div style="width:0"></div>'}
        <div class="step-dot">${dotContent}</div>
        ${i < STEPS.length - 1 ? '<div class="step-line"></div>' : '<div style="width:0"></div>'}
      </div>
      <div class="step-label">${step.label}</div>
    </div>`;
  }).join("");

  const nextStep = STEPS[idx + 1];
  let actionHtml;
  if (job.status === "done") {
    actionHtml = `<div class="tick-burst">✓ Job complete</div>`;
  } else if (nextStep) {
    actionHtml = `<button class="actionbtn" data-id="${job.id}" data-next="${nextStep.key}">${nextStep.icon} Mark "${nextStep.label}"</button>`;
  } else {
    actionHtml = "";
  }

  // NAVIGATE fires real turn-by-turn: Apple Maps natively on iPhone/iPad,
  // Google Maps directions everywhere else. The address text stays as a
  // secondary pin link for "where is that?" glances.
  const isApple = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);
  const dest = job.location ? encodeURIComponent(job.location) : null;
  const navUrl = dest ? (isApple ? `https://maps.apple.com/?daddr=${dest}&dirflg=d` : `https://www.google.com/maps/dir/?api=1&destination=${dest}`) : null;
  const altUrl = dest ? (isApple ? `https://www.google.com/maps/dir/?api=1&destination=${dest}` : `https://maps.apple.com/?daddr=${dest}&dirflg=d`) : null;
  const locHtml = dest
    ? `<a class="job-loc" href="https://maps.google.com/?q=${dest}" target="_blank" rel="noopener">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span>${escapeHtml(job.location)}</span>
      </a>
      <div class="navrow">
        <a class="navbtn" href="${navUrl}" target="_blank" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>
          NAVIGATE</a>
        <a class="navbtn alt" href="${altUrl}" target="_blank" rel="noopener">${isApple ? "G Maps" : "Apple"}</a>
      </div>`
    : "";
  const detailsHtml = job.details ? `<div class="job-details">${linkifyPhones(escapeHtml(job.details))}</div>` : "";

  return `<div class="job"><div class="in">
    <div class="job-top">
      <div>
        <div class="job-time">${fmtTime(job.start)}</div>
        <div class="job-title">${escapeHtml(job.title)}</div>
      </div>
      <div class="statuspill" style="background:${pill.bg};color:${pill.fg}">${statusLabel(job.status)}</div>
    </div>
    ${locHtml}
    ${detailsHtml}
    <div class="track">${stepsHtml}</div>
    ${actionHtml}
  </div></div>`;
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Any phone number in the job notes becomes one-tap callable.
function linkifyPhones(s) {
  return s.replace(/(\+?1[\s.-]?)?(\(?\d{3}\)?[\s.-]?\d{3}[\s.-]?\d{4})\b/g, (m) => {
    const digits = m.replace(/[^\d+]/g, "");
    return digits.replace(/\D/g, "").length >= 10 ? `<a href="tel:${digits}">${m}</a>` : m;
  });
}

// ---- Punch clock ----
let clockTicker = null;
function fmtHMS(totalSeconds) {
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = Math.floor(totalSeconds % 60);
  return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}
function renderClock(clock) {
  if (clockTicker) { clearInterval(clockTicker); clockTicker = null; }
  if (!clock) { $("clock").innerHTML = ""; return; }
  const baseSeconds = clock.todaySeconds || 0;
  const baseAt = Date.now();
  const on = clock.clockedIn;
  $("clock").innerHTML = `<div class="clockcard${on ? " on" : ""}"><div class="in">
    <div class="clockrow">
      <div>
        <div class="clocklabel" style="color:${on ? "var(--amber)" : "var(--emerald)"}">
          <span class="clockdot" style="background:${on ? "var(--amber)" : "var(--emerald)"};${on ? "box-shadow:0 0 8px var(--amber);animation:pulse 2s ease-in-out infinite" : ""}"></span>
          ${on ? "ON THE CLOCK" : "OFF THE CLOCK"}
        </div>
        <div class="clocktime" id="clockelapsed">${fmtHMS(baseSeconds)}</div>
        <div class="clocksub">${on ? `since ${new Date(clock.clockInAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}` : (baseSeconds > 0 ? "worked today" : "tap to start your day")}</div>
      </div>
      <button class="clockbtn ${on ? "out" : "in"}" id="clockbtn">${on ? "CLOCK OUT" : "CLOCK IN"}</button>
    </div>
  </div></div>`;
  if (on) {
    clockTicker = setInterval(() => {
      const el = $("clockelapsed");
      if (el) el.textContent = fmtHMS(baseSeconds + Math.round((Date.now() - baseAt) / 1000));
    }, 1000);
  }
  $("clockbtn").onclick = async () => {
    const btn = $("clockbtn");
    if (busy) return;
    busy = true; btn.disabled = true; btn.textContent = "…";
    try {
      const r = await fetch(FN, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ action: "crew-link/clock", token, direction: on ? "out" : "in" }),
      });
      const d = await r.json();
      if (!r.ok) {
        if (r.status === 404) { showExpired(d.error || "This link is no longer active."); busy = false; return; }
        alert(d.error || "Couldn't update the clock — try again.");
        busy = false; renderClock(clock); return;
      }
      busy = false;
      render(d);
      return;
    } catch (e) {
      alert("Couldn't update the clock — check your connection.");
      busy = false; renderClock(clock);
    }
  };
}

function render(data) {
  renderClock(data.clock);
  $("greeting").textContent = `Hi, ${data.crewMemberName || "there"}`;
  $("bizline").textContent = data.business ? `${data.business} — today's jobs` : "Today's jobs";
  const d = new Date(`${data.date}T12:00:00`);
  $("datebadge").textContent = isNaN(d.getTime()) ? "TODAY" : d.toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" }).toUpperCase();

  const jobs = data.jobs || [];
  if (!jobs.length) {
    $("jobs").innerHTML = `<div class="empty">
      <div style="font-size:40px">☕</div>
      <h2>No jobs today</h2>
      <p>Nothing on your list for today. Check back tomorrow.</p>
    </div>`;
  } else {
    const done = jobs.filter((j) => j.status === "done").length;
    const meter = jobs.length > 1 || done > 0
      ? `<div class="daymeter">
          <div class="bar"><div class="fill" style="width:${Math.round((done / jobs.length) * 100)}%"></div></div>
          <div class="count">${done} OF ${jobs.length} DONE${done === jobs.length ? " ✓" : ""}</div>
        </div>`
      : "";
    $("jobs").innerHTML = meter + jobs.map(jobCard).join("");
  }

  document.querySelectorAll(".actionbtn[data-id]").forEach((btn) => {
    btn.onclick = () => setStatus(btn.dataset.id, btn.dataset.next, btn);
  });
}

async function load(showLoading) {
  try {
    const r = await fetch(FN, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ action: "crew-link/jobs", token }),
    });
    const d = await r.json();
    if (!r.ok) {
      showExpired(d.error || "This link is no longer active.");
      return;
    }
    $("loading").style.display = "none";
    $("expired").style.display = "none";
    $("app").style.display = "block";
    render(d);
  } catch (e) {
    if (showLoading) $("loading").textContent = "Couldn't load your jobs — check your connection.";
  }
}

function showExpired(msg) {
  $("loading").style.display = "none";
  $("app").style.display = "none";
  $("expiredmsg").textContent = msg;
  $("expired").style.display = "block";
  if (refreshTimer) clearInterval(refreshTimer);
}

async function setStatus(assignmentId, status, btn) {
  if (busy) return;
  busy = true;
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Updating…";
  try {
    const r = await fetch(FN, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ action: "crew-link/status", token, assignment_id: assignmentId, status }),
    });
    const d = await r.json();
    if (!r.ok) {
      if (r.status === 404) { showExpired(d.error || "This link is no longer active."); busy = false; return; }
      btn.disabled = false; btn.textContent = original;
      alert(d.error || "Couldn't update status — try again.");
      busy = false;
      return;
    }
    render(d);
  } catch (e) {
    btn.disabled = false; btn.textContent = original;
    alert("Couldn't update status — check your connection.");
  }
  busy = false;
}

if (!token) {
  showExpired("This link is missing its access token.");
} else {
  load(true);
  refreshTimer = setInterval(() => load(false), 60000);
}
</script>
</body></html>
