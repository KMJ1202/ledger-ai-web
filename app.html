<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Ledger AI</title>
<style>
:root{--bg:#0b0f14;--card:#141a22;--line:#232c37;--text:#f3f5f7;--dim:#9aa6b2;--cyan:#22d3ee;--purple:#a855f7;--emerald:#34d399;--gold:#fbbf24;--red:#f87171;--orange:#fb923c}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column}
#root{display:flex;flex-direction:column;height:100dvh;max-width:760px;margin:0 auto;width:100%}
header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;border-bottom:1px solid var(--line)}
.mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,rgba(34,211,238,.25),rgba(168,85,247,.22));display:flex;align-items:center;justify-content:center;font-weight:800;background-clip:padding-box;color:var(--cyan);border:1px solid rgba(34,211,238,.4)}
h1{font-size:17px;margin:0;flex:1}
.pill{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--dim);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;user-select:none}
.pill.on{color:var(--emerald);border-color:var(--emerald);background:rgba(52,211,153,.12)}
#usage{font-size:11px;color:var(--dim);padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.04)}
#banner{display:none;background:rgba(52,211,153,.1);color:var(--emerald);font-size:12px;padding:7px 16px}
#alertbar{display:none;background:rgba(251,146,60,.12);color:var(--orange);font-size:12px;padding:7px 16px}
main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:86%;padding:11px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word;line-height:1.45;font-size:15px}
.me{align-self:flex-end;background:linear-gradient(135deg,#0e7490,#155e75);color:#fff;border-bottom-right-radius:5px}
.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.sys{align-self:center;color:var(--dim);font-size:12px;text-align:center}
.card{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;width:100%;max-width:420px}
.card h3{margin:0 0 4px;font-size:13px;letter-spacing:1px;color:var(--cyan)}
.card .cust{font-weight:700;font-size:16px;margin-bottom:8px}
.card table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:8px}
.card td{padding:3px 0;color:var(--dim)}.card td:last-child{text-align:right;color:var(--text)}
.card .total{font-weight:800;font-size:15px}
.row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;border:0;border-radius:11px;padding:11px;font-weight:700;font-size:14px;cursor:pointer}
.confirm{background:var(--emerald);color:#07211a}.cancel{background:rgba(255,255,255,.08);color:var(--dim)}
.emailrow{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);margin-top:6px}
footer{padding:10px 12px calc(env(safe-area-inset-bottom) + 12px);border-top:1px solid var(--line);display:flex;gap:9px;align-items:flex-end}
textarea{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--text);font-size:15px;padding:11px 13px;resize:none;max-height:120px;font-family:inherit;outline:none}
#send{width:44px;height:44px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#fff;font-size:19px;cursor:pointer;flex-shrink:0}
#send:disabled{opacity:.4}
.login{margin:auto;text-align:center;padding:32px;max-width:360px;width:100%}
.login .mark{width:74px;height:74px;margin:0 auto 18px;font-size:34px;border-radius:20px}
.login h2{margin:0 0 6px}.login p{color:var(--dim);font-size:14px;margin:0 0 22px;line-height:1.5}
.login input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:13px;color:var(--text);font-size:16px;padding:14px;margin-bottom:11px;outline:none}
.login .btn{width:100%;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#fff;padding:14px}
.typing{align-self:flex-start;color:var(--dim);font-size:13px;padding:6px 14px}
.menu{background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer;padding:4px}
b{color:#fff}
</style>
</head>
<body><div id="root"></div>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const SUPA_URL = "https://lbzkyyehmgudlxmfpzzh.supabase.co";
const supa = createClient(SUPA_URL, "sb_publishable_I0BQ5Rkc2GCxKOlobtzCNg_GxAtNuPu");
const FN = SUPA_URL + "/functions/v1";
const root = document.getElementById("root");
let advisor = localStorage.getItem("ledger.advisor") === "1";
let conversationId = localStorage.getItem("ledger.conv") || null;
let usage = null;

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});

function esc(s){const d=document.createElement("div");d.textContent=s??"";return d.innerHTML}
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}
function money(n){return (Number(n)||0).toLocaleString(undefined,{style:"currency",currency:"USD"}).replace("US$","$")}

async function token(){const {data}=await supa.auth.getSession();return data.session?.access_token??null}
async function api(path, body, method="POST"){
  const t = await token(); if(!t) throw new Error("Signed out");
  const r = await fetch(FN+path,{method,headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.message||d.error||("Request failed ("+r.status+")"));
  return d;
}

function loginView(sent){
  root.innerHTML = `<div class="login"><div class="mark">L</div><h2>Ledger AI</h2>
  <p>${sent?"Check your email — tap the sign-in link and you'll land right back here.":"Your business copilot. Sign in with your work email."}</p>
  ${sent?"":'<input id="email" type="email" placeholder="you@business.com" autocomplete="email"><button class="btn" id="go">Send sign-in link</button>'}</div>`;
  if(!sent){
    const go = async ()=>{
      const email = document.getElementById("email").value.trim(); if(!email) return;
      const {error} = await supa.auth.signInWithOtp({email, options:{emailRedirectTo: location.href.split("#")[0].split("?")[0]}});
      if(error) alert(error.message); else loginView(true);
    };
    document.getElementById("go").onclick = go;
    document.getElementById("email").addEventListener("keydown",e=>{if(e.key==="Enter")go()});
  }
}

function appView(){
  root.innerHTML = `
  <header><div class="mark">L</div><h1>Ledger AI</h1>
    <span id="usage"></span>
    <span class="pill${advisor?" on":""}" id="advisor">💡 Advisor</span>
    <button class="menu" id="more" title="Menu">⋯</button></header>
  <div id="banner">💡 Advisor Mode — business guidance beyond your books, on your AI allowance</div>
  <div id="alertbar"></div>
  <main id="chat"></main>
  <footer><textarea id="box" rows="1" placeholder="Ask about your business…"></textarea><button id="send">↑</button></footer>`;
  document.getElementById("advisor").onclick = toggleAdvisor;
  document.getElementById("more").onclick = menu;
  const box = document.getElementById("box");
  box.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
  box.addEventListener("input",()=>{box.style.height="auto";box.style.height=Math.min(box.scrollHeight,120)+"px"});
  document.getElementById("send").onclick = send;
  banner();
  sys("Connected to your live books and calendar. Ask me anything — sales, who owes you, your week ahead.");
  refreshUsage();
  billingCheck();
}

function banner(){document.getElementById("banner").style.display = advisor?"block":"none";
  const p=document.getElementById("advisor"); if(p) p.className="pill"+(advisor?" on":"")}
function toggleAdvisor(){
  if(!advisor && localStorage.getItem("ledger.advisorNotice")!=="1"){
    const meter = usage?` (${money(usage.spent_usd)} of ${money(usage.budget_usd)} used this month)`:"";
    if(!window.confirm("Advisor Mode opens up business guidance beyond your books — marketing, pricing, hiring, growth — grounded in your real numbers. It uses your monthly AI allowance"+meter+".")) return;
    localStorage.setItem("ledger.advisorNotice","1");
  }
  advisor=!advisor; localStorage.setItem("ledger.advisor",advisor?"1":"0"); banner();
}

function chatEl(){return document.getElementById("chat")}
function scroll(){const c=chatEl();c.scrollTop=c.scrollHeight}
function bubble(cls,html){const d=document.createElement("div");d.className=cls;d.innerHTML=html;chatEl().appendChild(d);scroll();return d}
function sys(t){bubble("sys",esc(t))}

function setUsage(u){usage=u;const el=document.getElementById("usage");
  if(el&&u&&u.budget_usd>0){el.textContent=Math.round(u.spent_usd/u.budget_usd*100)+"% AI used"}}
async function refreshUsage(){try{setUsage(await api("/ledger-ai",{action:"usage"}))}catch{}}
async function billingCheck(){
  try{const s=await api("/stripe-billing/status",{});
    const a=document.getElementById("alertbar");
    const subscribeLink=(label)=>{const b=document.createElement("u");b.style.cursor="pointer";b.textContent=label;
      b.onclick=async()=>{try{const c=await api("/stripe-billing/checkout",{});location.href=c.url}catch(e){alert(e.message)}};a.appendChild(b)};
    if(s.subscription_status==="canceled"){
      a.textContent="Subscription inactive — renew to keep your copilot."; a.style.display="block";
      if(s.billing_ready)subscribeLink(" Renew now");
    } else if(s.subscription_status==="trialing"&&s.trial_days_left!==null){
      a.style.background="rgba(251,191,36,.12)";a.style.color="var(--gold)";
      a.textContent=s.trial_days_left>0?("\ud83c\udf81 Free trial \u2014 "+s.trial_days_left+" day"+(s.trial_days_left===1?"":"s")+" left."):"\u23f0 Your free trial has ended.";
      if(s.billing_ready)subscribeLink(" Subscribe now");
      a.style.display="block";
    }
  }catch{}}

async function send(){
  const box=document.getElementById("box");const text=box.value.trim();if(!text)return;
  box.value="";box.style.height="auto";
  bubble("msg me",esc(text));
  const t=bubble("typing","Ledger is thinking…");
  document.getElementById("send").disabled=true;
  try{
    const d=await api("/ledger-ai",{message:text,mode:advisor?"advisor":"books",...(conversationId?{conversation_id:conversationId}:{})});
    conversationId=d.conversation_id;localStorage.setItem("ledger.conv",conversationId);
    t.remove();bubble("msg ai",md(d.reply));
    if(d.usage_status)setUsage(d.usage_status);
    (d.invoice_drafts||[]).forEach(x=>draftCard(x,"INVOICE DRAFT","/quickbooks-invoice/confirm","/quickbooks-invoice/cancel"));
    (d.estimate_drafts||[]).forEach(x=>draftCard(x,"ESTIMATE DRAFT","/quickbooks-invoice/estimate-confirm","/quickbooks-invoice/estimate-cancel"));
    (d.booking_drafts||[]).forEach(bookingCard);
    (d.reminder_drafts||[]).forEach(reminderCard);
  }catch(e){t.remove();bubble("msg ai",esc(e.message))}
  document.getElementById("send").disabled=false;
}

function draftCard(d,label,confirmPath,cancelPath){
  const lines=(d.lines||[]).map(l=>`<tr><td>${esc(l.description||l.item_name)} × ${l.quantity}</td><td>${money(l.amount)}</td></tr>`).join("");
  const card=bubble("card",`<h3>${label}</h3><div class="cust">${esc(d.customer)}</div>
    <table>${lines}<tr><td class="total">Subtotal</td><td class="total">${money(d.subtotal)}</td></tr></table>
    ${d.customer_email?`<label class="emailrow"><input type="checkbox" class="em" checked> Email to ${esc(d.customer_email)}</label>`:""}
    <div class="row"><button class="btn cancel">Cancel</button><button class="btn confirm">Confirm</button></div>`);
  const done=(msg)=>{card.querySelector(".row").remove();const s=document.createElement("div");s.className="emailrow";s.textContent=msg;card.appendChild(s);scroll()};
  card.querySelector(".confirm").onclick=async(ev)=>{ev.target.disabled=true;
    try{const sendEmail=card.querySelector(".em")?.checked??false;
      const r=await api(confirmPath,{draft_id:d.draft_id,send_email:sendEmail});
      done("✅ Posted"+(r.doc_number?" — #"+r.doc_number:"")+(r.emailed?" · emailed "+(r.emailed_to||""):""));
    }catch(e){ev.target.disabled=false;alert(e.message)}};
  card.querySelector(".cancel").onclick=async(ev)=>{ev.target.disabled=true;
    try{await api(cancelPath,{draft_id:d.draft_id});done("Draft cancelled")}catch(e){ev.target.disabled=false;alert(e.message)}};
}

function reminderCard(d){
  const rows=(d.invoices||[]).map(i=>`<tr><td>#${esc(i.doc_number)} · due ${esc(i.due_date)}</td><td>${money(i.balance)}</td></tr>`).join("");
  const card=bubble("card",`<h3>PAYMENT REMINDER</h3><div class="cust">${esc(d.customer)}</div>
    <table>${rows}<tr><td class="total">Total due</td><td class="total">${money(d.total_due)}</td></tr></table>
    <div class="emailrow">QuickBooks will email these invoices with a pay link to ${esc(d.customer_email)}</div>
    <div class="row"><button class="btn cancel">Cancel</button><button class="btn confirm">Send reminder</button></div>`);
  const done=(msg)=>{card.querySelector(".row").remove();const s=document.createElement("div");s.className="emailrow";s.textContent=msg;card.appendChild(s);scroll()};
  card.querySelector(".confirm").onclick=async(ev)=>{ev.target.disabled=true;
    try{const r=await api("/quickbooks-invoice/reminder-confirm",{draft_id:d.draft_id});
      done("✅ Reminder emailed to "+(r.emailed_to||d.customer_email)+((r.failed||[]).length?" · couldn't send: "+r.failed.join(", "):""));
    }catch(e){ev.target.disabled=false;alert(e.message)}};
  card.querySelector(".cancel").onclick=async(ev)=>{ev.target.disabled=true;
    try{await api("/quickbooks-invoice/reminder-cancel",{draft_id:d.draft_id});done("Cancelled — nothing was sent")}catch(e){ev.target.disabled=false;alert(e.message)}};
}

function bookingCard(d){
  const card=bubble("card",`<h3>BOOKING DRAFT</h3><div class="cust">${esc(d.title)}</div>
    <table><tr><td>Starts</td><td>${esc(new Date(d.start).toLocaleString())}</td></tr>
    <tr><td>Ends</td><td>${esc(new Date(d.end).toLocaleString())}</td></tr>
    ${d.location?`<tr><td>Where</td><td>${esc(d.location)}</td></tr>`:""}</table>
    <div class="row"><button class="btn cancel">Cancel</button><button class="btn confirm">Book it</button></div>`);
  const done=(msg)=>{card.querySelector(".row").remove();const s=document.createElement("div");s.className="emailrow";s.textContent=msg;card.appendChild(s);scroll()};
  card.querySelector(".confirm").onclick=async(ev)=>{ev.target.disabled=true;
    try{await api("/google-calendar/booking-confirm",{draft_id:d.draft_id});done("✅ Booked")}catch(e){ev.target.disabled=false;alert(e.message)}};
  card.querySelector(".cancel").onclick=async(ev)=>{ev.target.disabled=true;
    try{await api("/google-calendar/booking-cancel",{draft_id:d.draft_id});done("Draft cancelled")}catch(e){ev.target.disabled=false;alert(e.message)}};
}

function menu(){
  const pick=window.prompt("Type: new = new conversation · billing = manage subscription · out = sign out");
  if(!pick)return;
  if(pick.startsWith("new")){conversationId=null;localStorage.removeItem("ledger.conv");chatEl().innerHTML="";sys("Fresh conversation started.")}
  else if(pick.startsWith("bill")){api("/stripe-billing/portal",{}).then(d=>location.href=d.url).catch(e=>alert(e.message))}
  else if(pick.startsWith("out")){supa.auth.signOut().then(()=>location.reload())}
}

function setupView(){
  root.innerHTML=`<div class="login"><div class="mark">L</div><h2>Welcome to Ledger AI</h2>
  <p>Let's set up your business. Your 14-day free trial starts now \u2014 no card needed.</p>
  <input id="bizname" placeholder="Business name" maxlength="160" autocomplete="organization">
  <select id="bizcur" style="width:100%;background:var(--card);border:1px solid var(--line);border-radius:13px;color:var(--text);font-size:16px;padding:14px;margin-bottom:11px">
    <option value="CAD">\ud83c\udde8\ud83c\udde6 Canadian dollars (CAD)</option><option value="USD">\ud83c\uddfa\ud83c\uddf8 US dollars (USD)</option></select>
  <button class="btn" id="bizgo">Start my free trial \u2192</button></div>`;
  document.getElementById("bizgo").onclick=async()=>{
    const name=document.getElementById("bizname").value.trim();
    if(name.length<2){alert("Enter your business name");return}
    try{
      const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||"America/Edmonton";
      await api("/workspace-profile",{action:"bootstrap",name,currency:document.getElementById("bizcur").value,timezone:tz});
      appView();
      sys("\ud83c\udf89 "+name+" is set up \u2014 your 14-day free trial is live. Ask me anything, and connect QuickBooks to bring your books in.");
    }catch(e){alert(e.message)}
  };
}

async function boot(){
  const {data:{session}} = await supa.auth.getSession();
  if(!session){loginView(false);return}
  try{
    const b=await api("/workspace-profile",{action:"bootstrap"});
    if(b.needs_setup)setupView(); else appView();
  }catch(e){appView()}
}
boot();
supa.auth.onAuthStateChange((event,s)=>{if(event==="SIGNED_IN"&&s&&!document.getElementById("chat")&&!document.getElementById("bizname"))boot()});
</script></body></html>
