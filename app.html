/* ===================================================================
   LEDGER OS — web design system. Mirrors the iOS app (CommandDashboardView):
   mono section codes, chrome screen titles, tinted glass panels,
   floating tab capsule, gradient orb.
   =================================================================== */
:root{
  --bg:#05070b;--bg2:#080b11;
  --card:#0f141c;--card2:#0b0f16;--glass:rgba(255,255,255,.045);
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.055);
  --text:#f2f6fa;--dim:#8d9aa8;--dim2:#65707d;
  --cyan:#3ac8f5;--blue:#3b82f6;--purple:#a855f7;--magenta:#e05cf0;
  --emerald:#2fe0a0;--gold:#fbbf24;--red:#f87171;--orange:#fb923c;
  --top:env(safe-area-inset-top);--bot:env(safe-area-inset-bottom);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --tabh:86px;
}
/* ---------- Phone tab: three lanes ---------- */
.zonehead{font:800 9.5px/1 var(--mono);letter-spacing:1.9px;color:var(--dim2);margin:19px 6px 10px}
.zonehead.hot{color:var(--red)}
/* Lane switcher — the Finance segmented control with the active lane lit. */
.plane{display:flex;gap:5px;padding:4px;border-radius:17px;margin-bottom:14px;
 background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}
.plane button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;border:1px solid transparent;
 font:800 10.5px/1 var(--mono);letter-spacing:1px;color:var(--dim2);padding:11px 4px;border-radius:13px;
 background:none;cursor:pointer;font-family:var(--mono)}
.plane button.on{color:var(--cyan);border-color:rgba(58,200,245,.5);
 background:linear-gradient(135deg,rgba(58,200,245,.2),rgba(168,85,247,.14));
 box-shadow:0 4px 18px rgba(58,200,245,.13)}
.panel.flush{padding:0;overflow:hidden}
.prow{display:flex;gap:12px;align-items:flex-start;padding:15px;border-top:1px solid var(--line2);cursor:pointer}
.prow:first-child{border-top:0}
.pchev{color:#4a5563;font-size:16px;align-self:center}
.needsdot{width:7px;height:7px;border-radius:99px;margin-top:6px;flex:0 0 7px}
.needst{font-size:13.6px;font-weight:700;letter-spacing:-.15px}
.needsm{font-size:12.1px;color:var(--dim);margin-top:4px;line-height:1.45}
.needsw{font:600 9.5px/1 var(--mono);letter-spacing:1px;color:var(--dim2);margin-top:7px;text-transform:uppercase}
/* Hero numbers — light weight, not bold. Bold reads cheap at this size. */
.panel.hero{display:flex;padding:2px 0}
.panel.hero>div{flex:1;padding:16px 6px;text-align:center;border-left:1px solid var(--line2)}
.panel.hero>div:first-child{border-left:0}
.panel.hero .n{font-size:29px;font-weight:300;letter-spacing:-1.4px;line-height:1;
 background:linear-gradient(160deg,#fff,#8fd8f2);-webkit-background-clip:text;background-clip:text;color:transparent}
.panel.hero .l{font:800 8.5px/1 var(--mono);letter-spacing:1.3px;color:var(--dim2);margin-top:9px}
/* ---------- Autopilot lane, rebuilt 2026-08-31 (Kyle override 1202) -------- */
/* Everything here is p-prefixed on purpose. This stylesheet already owns
   .spark (Finance's 96px revenue chart), .tick, .swx and .ihead, and a plain
   .spark here inherited a 96px height that stretched every row on the tab. A
   generic class name in a single shared stylesheet is a collision waiting for
   the next feature. */

/* THE STATUS RAIL. One line where a whole card used to sit — a heading, a
   number that never changes, a paragraph of marketing, and a button pressed
   once in the life of the account. The dot is the only thing on this tab that
   reports the present tense; everything else is a report on a week gone by. */
.prail{display:flex;align-items:center;gap:9px;padding:10px 14px;margin-bottom:12px;
 border-radius:14px;background:var(--glass);border:1px solid var(--line)}
.prail b{font-size:15.5px;font-weight:800;letter-spacing:-.2px}
.pdot{width:8px;height:8px;border-radius:99px;flex:0 0 8px;background:var(--dim2)}
.pdot.open{background:var(--emerald);box-shadow:0 0 0 0 rgba(47,224,160,.55);animation:ppulse 2.4s ease-out infinite}
@keyframes ppulse{70%{box-shadow:0 0 0 7px rgba(47,224,160,0)}100%{box-shadow:0 0 0 0 rgba(47,224,160,0)}}
.prstate{font:800 8.5px/1 var(--mono);letter-spacing:1.2px;color:var(--dim2)}
.prstate.open{color:var(--emerald)}
.prarm{margin-left:auto;font:800 8.5px/1 var(--mono);letter-spacing:1.2px;color:var(--dim2)}
.prarm.on{color:var(--cyan)}

/* THE ARMATURE. A breaker panel for the phone line: how much of it is live is
   a shape you read, not a sentence you parse. A dark bar is one tap from lit.
   It carries no count — the rail above already says 3 OF 5, and a screen that
   states the same fact twice is a screen that trusts neither statement. */
.panel.armature{padding:15px 13px 13px}
.arow{display:flex;gap:7px}
.aseg{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;
 background:none;border:0;padding:0;cursor:pointer;font-family:inherit;color:var(--dim2)}
.abar{width:100%;height:34px;border-radius:7px;background:rgba(255,255,255,.05);
 border:1px solid var(--line2);transition:background .2s,box-shadow .2s,border-color .2s}
.aseg.lit .abar{background:linear-gradient(180deg,var(--seg),color-mix(in srgb,var(--seg) 45%,transparent));
 border-color:color-mix(in srgb,var(--seg) 55%,transparent);
 box-shadow:0 0 14px color-mix(in srgb,var(--seg) 40%,transparent)}
.aseg.lit{color:var(--seg)}
/* A dark segment that is costing something is not merely off. It wears the
   same amber the row below it wears, so the panel warns before the list does. */
.aseg.cost{color:var(--seg)}
.aseg.cost .abar{border-color:color-mix(in srgb,var(--seg) 45%,transparent);
 background:color-mix(in srgb,var(--seg) 9%,transparent)}
.aseg:active .abar{transform:scale(.96)}
.acode{font:800 8px/1 var(--mono);letter-spacing:1.1px}

/* A ROW IS ITS OWN VERDICT. The rail carries the tone the server ranked it
   with, so an amber row is visible before a single word is read. */
.zonehead.cost{color:var(--gold)}
.prow.autorow{align-items:center;gap:11px;position:relative;padding-left:17px}
.autorail{position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--tone)}
.autorow .needst{display:flex;flex-wrap:wrap;align-items:center;gap:7px}
.pihead{font:800 8.5px/1 var(--mono);letter-spacing:.9px;color:var(--tone);
 border:1px solid color-mix(in srgb,var(--tone) 40%,transparent);
 background:color-mix(in srgb,var(--tone) 12%,transparent);
 border-radius:99px;padding:4px 7px;white-space:nowrap}
/* Two lines in the row, the whole sentence in the sheet. The row is a verdict,
   not a paragraph. */
.autorow .needsm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* SEVEN DAYS OF SHAPE. Bars, not a line — these are counts of discrete things
   that happened, and a line would imply a continuous quantity. align-self is
   explicit so this can never inherit a stretch from a row rule again. */
.pspark{display:flex;align-items:flex-end;gap:2px;width:38px;height:26px;
 flex:0 0 38px;align-self:center;color:var(--dim2)}
.pspark i{flex:1;border-radius:1.5px;min-height:2px}
.pspark.flat{align-items:center}
.pspark.flat::before{content:"";width:100%;height:2px;border-radius:2px;background:currentColor;opacity:.22}

/* THE SWITCH IS A SWITCH. It replaced an ON pill sitting beside a TURN OFF
   button — two controls saying one thing — and a caption underneath telling
   you they were controls at all. */
.pswx{flex:0 0 44px;width:44px;height:26px;border-radius:99px;border:1px solid var(--line);
 background:rgba(255,255,255,.05);position:relative;cursor:pointer;padding:0;align-self:center;
 transition:background .2s,border-color .2s}
.pswx i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:99px;background:#7d8b99;
 transition:transform .2s cubic-bezier(.4,1.3,.6,1),background .2s}
.pswx.on{background:rgba(47,224,160,.2);border-color:rgba(47,224,160,.55)}
.pswx.on i{transform:translateX(18px);background:var(--emerald);box-shadow:0 0 10px rgba(47,224,160,.6)}

/* THE PROOF TICKER. Every autonomous text this line has ever sent was already
   a row in the database, and was never once shown to the owner paying for it.
   Sentences, not event names: being challengeable is the point. */
.panel.pticker{padding:6px 14px 14px}
.ptickday{font:800 8.5px/1 var(--mono);letter-spacing:1.4px;color:var(--dim2);margin:15px 0 4px}
.ptickday:first-child{margin-top:8px}
.ptick{display:flex;align-items:flex-start;gap:10px;padding:6px 0}
.ptickt{font:600 10px/1.5 var(--mono);color:var(--dim2);flex:0 0 46px;text-align:right}
.ptickdot{width:5px;height:5px;border-radius:99px;background:var(--tone);flex:0 0 5px;margin-top:5px}
.ptickx{font-size:12.4px;color:var(--dim);line-height:1.45}
@media (prefers-reduced-motion:reduce){.pdot.open{animation:none}.pswx i{transition:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior-y:none}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
}
#root{
  display:flex;flex-direction:column;height:100dvh;max-width:760px;margin:0 auto;width:100%;position:relative;
  background:
    radial-gradient(120% 55% at 50% -12%,rgba(59,130,246,.13),transparent 62%),
    radial-gradient(90% 45% at 105% 8%,rgba(168,85,247,.10),transparent 60%),
    var(--bg);
}

/* ---------- top bar ---------- */
header{
  display:flex;align-items:center;gap:12px;
  padding:calc(var(--top) + 14px) 18px 12px;flex-shrink:0;position:relative;z-index:5;
}
.mark{
  width:44px;height:44px;border-radius:14px;flex-shrink:0;overflow:hidden;
  background:linear-gradient(140deg,#1b232f,#0d1219);
  border:1px solid rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:19px;color:var(--cyan);
  box-shadow:0 6px 18px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);
}
.mark img{width:100%;height:100%;object-fit:cover}
h1{font-size:19px;font-weight:800;margin:0;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.avatar{
  width:44px;height:44px;border-radius:50%;flex-shrink:0;border:1px solid rgba(58,200,245,.35);cursor:pointer;
  background:radial-gradient(circle at 30% 25%,rgba(58,200,245,.30),rgba(13,32,48,.9) 70%),#0d1723;
  color:var(--cyan);display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 18px rgba(58,200,245,.22),inset 0 1px 0 rgba(255,255,255,.12);
}
.avatar svg{width:24px;height:24px}
.chrome{
  background:linear-gradient(180deg,#ffffff 0%,#dfe9f5 45%,#8fb3cc 75%,#e8f4ff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(58,200,245,.35)) drop-shadow(0 1px 0 rgba(0,0,0,.6));
}
h1.brandttl{font-size:19px;font-weight:900;letter-spacing:.4px}
#usage{border:1px solid rgba(58,200,245,.30);box-shadow:0 0 12px rgba(58,200,245,.14)}
.pill{
  border:1px solid var(--line);background:var(--glass);color:var(--dim);border-radius:999px;
  padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;user-select:none;white-space:nowrap;font-family:inherit;
}
.pill.on{color:var(--emerald);border-color:rgba(47,224,160,.55);background:rgba(47,224,160,.12)}
#usage{font-size:11px;color:var(--dim2);padding:6px 10px;border-radius:999px;background:var(--glass);white-space:nowrap;font-family:var(--mono)}
#banner{display:none;background:rgba(47,224,160,.09);color:var(--emerald);font-size:12px;padding:8px 18px;font-weight:600}
#alertbar{display:none;background:rgba(251,146,60,.11);color:var(--orange);font-size:12px;padding:8px 18px;font-weight:600}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px calc(var(--tabh) + var(--bot) + 22px);display:flex;flex-direction:column;gap:14px}
main.chatpane{padding:16px}

/* ---------- OS section header (— LEDGER OS // FIN.02 · REVENUE GRID) ---------- */
.oshead{display:flex;align-items:center;gap:9px;padding:6px 2px 0}
.oshead .dash{width:16px;height:2px;background:var(--cyan);border-radius:2px;flex-shrink:0;box-shadow:0 0 8px rgba(58,200,245,.7)}
.oshead .code{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:2.1px;color:var(--cyan);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oshead .eq{margin-left:auto;display:flex;align-items:flex-end;gap:2.5px;height:14px;flex-shrink:0}
.oshead .eq i{width:3px;border-radius:2px;background:var(--cyan);opacity:.9;display:block}
.oshead .eq i:nth-child(1){height:6px;opacity:.45}
.oshead .eq i:nth-child(2){height:13px}
.oshead .eq i:nth-child(3){height:9px;opacity:.7}
.ostitle{
  margin:8px 0 0;font-size:40px;line-height:1;font-weight:900;letter-spacing:-1.2px;text-transform:uppercase;
  background:linear-gradient(180deg,#ffffff 0%,#dbe4ec 46%,#8d9dad 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.osrule{height:2px;border-radius:2px;margin:11px 0 2px;background:linear-gradient(90deg,rgba(58,200,245,.95),rgba(58,200,245,.12) 62%,transparent)}

/* ---------- generic surfaces ---------- */
.sect{display:flex;flex-direction:column;gap:13px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:1.8px;font-weight:800;color:var(--cyan);text-transform:uppercase}
.panel{
  background:linear-gradient(160deg,var(--card),var(--card2));
  border:1px solid var(--line);border-radius:20px;padding:17px;
  box-shadow:0 10px 26px rgba(0,0,0,.36);
}
.panel h3{margin:0 0 4px;font-size:16px;font-weight:800;letter-spacing:-.2px}
.panel p.sub{margin:0;color:var(--dim);font-size:13.5px;line-height:1.55}

/* phone command-center status strip */
.phstrip{display:flex;flex-direction:column;gap:9px;padding:13px 14px;border-radius:16px;
  background:rgba(255,255,255,.045);border:1px solid rgba(58,200,245,.22)}
.phrow{display:flex;gap:10px;min-width:0}
.phrule{height:1px;background:rgba(255,255,255,.08)}

/* text threads — inbox rows, thread bubbles, reply composer */
.thitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.thitem .ttl{display:flex;align-items:center;gap:6px}
.thdot{width:7px;height:7px;border-radius:50%;background:var(--orange);flex-shrink:0}
.thitem.unread .sub{color:var(--fg)}
.thmeta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.thmeta small{font-size:11px;color:var(--dim)}
.thdone{color:var(--emerald);font-size:13px}
.chat{max-height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px;
  margin-top:12px;padding:12px 2px;-webkit-overflow-scrolling:touch}
.bubrow{display:flex}
.bubrow.me{justify-content:flex-end}
.bub{max-width:78%;padding:9px 13px;border-radius:17px;font-size:14px;line-height:1.45;
  white-space:pre-wrap;word-break:break-word}
.bubrow.them .bub{background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.1)}
.bubrow.me .bub{background:linear-gradient(135deg,var(--cyan),#2b6cf6);color:#fff;border:none}
.bubstamp{font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-top:4px;
  display:flex;gap:5px;align-items:center}
.bubrow.me .bubstamp{justify-content:flex-end}
.bubstamp .auto{color:var(--emerald);font-weight:800}
.bubstamp .failed{color:var(--orange);font-weight:800}
.composer{display:flex;gap:9px;align-items:flex-end;margin-top:10px}
.composer textarea{flex:1;min-height:44px;max-height:120px;resize:none;border-radius:18px;padding:11px 14px}
.composer .btn{flex-shrink:0}
.phcell{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.phcell small{font-family:var(--mono);font-size:8px;font-weight:800;letter-spacing:1px;color:var(--dim);text-transform:uppercase}
.phcell b{font-size:13px;font-weight:800;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phcell b.ok{color:var(--emerald)}.phcell b.warn{color:var(--orange)}
.phcell.line{flex-direction:row;align-items:center;gap:7px}
.phcell.line .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.phcell.line .dot.on{background:var(--emerald);box-shadow:0 0 6px var(--emerald)}
.phcell.line .dot.off{background:var(--orange);box-shadow:0 0 6px var(--orange)}
.phcell.line div{display:flex;flex-direction:column;gap:3px;min-width:0}

/* phone settings summary row — opens the hours/template sheet, keeps the
   editor out of the tab's own scroll flow */
.phsettingsrow{display:flex;align-items:center;gap:12px;cursor:pointer}
.phsettingsrow .ic{width:42px;height:42px;border-radius:11px;flex-shrink:0;
  background:rgba(58,200,245,.14);display:flex;align-items:center;justify-content:center;font-size:18px}
.phsettingsrow .m{flex:1;min-width:0}
.phsettingsrow .m b{display:block;font-size:14.5px;font-weight:700}
.phsettingsrow .m span{display:block;color:var(--dim);font-size:12.5px;margin-top:2px}
.phsettingsrow .chev{color:var(--dim)}

/* leads lane, now hosted under the Phone tab */
.lanehdr{display:flex;align-items:center;gap:10px}
.lanehdr .eyebrow{flex:1;min-width:0}
.chip.add{padding:7px 12px;font-size:12.5px;border-color:rgba(47,224,160,.45);color:var(--emerald);background:rgba(47,224,160,.1)}
.leadtiles{display:flex;gap:9px}
.leadtile{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding:11px;border-radius:14px;
  background:linear-gradient(135deg,rgba(255,255,255,.055),rgba(255,255,255,.02));border:1px solid var(--line)}
.leadtile small{font-family:var(--mono);font-size:8px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.leadtile b{font-size:16px;font-weight:900;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leadtile i{font-style:normal;font-size:9.5px;color:var(--dim2)}
.leadtile.cyan{border-color:rgba(58,200,245,.24)}.leadtile.cyan small{color:var(--cyan)}
.leadtile.red{border-color:rgba(248,113,113,.3)}.leadtile.red small{color:var(--red)}
.leadtile.emerald{border-color:rgba(47,224,160,.24)}.leadtile.emerald small{color:var(--emerald)}
.leadtile.dim small{color:var(--dim)}
.callq{padding:12px 13px;border-radius:16px;background:rgba(248,113,113,.055);border:1px solid rgba(248,113,113,.22)}
.callq .list{background:none}
.qcall{flex-shrink:0;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(47,224,160,.14);font-size:14px}
.leadfilters{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.leadfilters::-webkit-scrollbar{display:none}
.leadfilters .chip{flex:0 0 auto;padding:7px 13px;font-size:12.5px}

/* brand / status card */
.brandcard{
  display:flex;align-items:center;gap:15px;padding:17px;border-radius:22px;
  background:linear-gradient(140deg,rgba(23,42,60,.75),rgba(10,15,22,.92));
  border:1px solid rgba(58,200,245,.32);
  box-shadow:0 0 40px rgba(58,200,245,.10),inset 0 1px 0 rgba(255,255,255,.06);
}
.brandcard .tile{
  width:62px;height:62px;border-radius:17px;flex-shrink:0;overflow:hidden;
  background:linear-gradient(140deg,#1d2836,#0b1017);border:1px solid rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:900;color:var(--cyan);
  box-shadow:0 8px 22px rgba(0,0,0,.55);
}
.brandcard .tile img{width:100%;height:100%;object-fit:cover}
.brandcard .who{flex:1;min-width:0}
.brandcard .who b{display:block;font-size:19px;font-weight:900;letter-spacing:1.1px;text-transform:uppercase;color:#fff}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:11px}
/* iOS Finance Overview tiles: 2x2 dark KPI cards, mono labels, big figures */
.fintiles{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:13px}
.fintile{
  position:relative;background:linear-gradient(160deg,var(--card),var(--card2));
  border:1px solid var(--line);border-radius:18px;padding:15px 16px;
  box-shadow:0 8px 22px rgba(0,0,0,.35);
}
.fintile small{display:block;font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:1.4px;color:var(--dim);text-transform:uppercase}
.fintile b{display:block;font-size:23px;font-weight:900;margin-top:6px;letter-spacing:-.8px}
.fintile.warn{border-color:rgba(251,146,60,.3)}
.fintile.blue{border-color:rgba(59,130,246,.3)}
.fintile .tic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;margin-bottom:9px}
.fintile .nextchip{position:absolute;top:12px;right:13px;font-size:10.5px;font-weight:700;color:var(--blue)}
.dtable{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0}
.dtable td{padding:7px 0;border-bottom:1px solid var(--line)}
.kpi{
  background:linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
  border:1px solid var(--line);border-radius:18px;padding:15px;
}
.kpi small{display:block;color:var(--dim);font-size:11.5px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase}
.kpi b{display:block;font-size:24px;font-weight:900;margin-top:5px;letter-spacing:-.8px}
.kpi i{display:block;font-style:normal;font-size:11.5px;color:var(--dim2);margin-top:4px}
.kpi.wide{grid-column:1/-1}
.kpi.cyan{border-color:rgba(58,200,245,.3)}.kpi.cyan small{color:var(--cyan)}.kpi.cyan b{color:var(--cyan)}
.kpi.gold{border-color:rgba(251,191,36,.28)}.kpi.gold small{color:var(--gold)}.kpi.gold b{color:var(--gold)}
.kpi.em{border-color:rgba(47,224,160,.3)}.kpi.em small{color:var(--emerald)}.kpi.em b{color:var(--emerald)}
.kpi.orange{border-color:rgba(251,146,60,.3)}.kpi.orange small{color:var(--orange)}.kpi.orange b{color:var(--orange)}
.kpi.purple{border-color:rgba(168,85,247,.32)}.kpi.purple small{color:var(--magenta)}.kpi.purple b{color:#fff}
.kpi.red{border-color:rgba(248,113,113,.3)}.kpi.red small{color:var(--red)}.kpi.red b{color:#fff}

/* hero */
.hero{
  background:linear-gradient(150deg,rgba(24,20,48,.75),rgba(9,12,18,.95));
  border:1px solid rgba(168,85,247,.34);border-radius:22px;padding:19px;
  box-shadow:0 0 34px rgba(168,85,247,.09);
}
.hero .headline{display:flex;align-items:baseline;gap:10px}
.hero .headline .eyebrow{color:var(--magenta)}
.hero .headline .when{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim2)}
.hero .big{font-size:44px;font-weight:900;letter-spacing:-2px;line-height:1.05;margin-top:8px;color:var(--emerald)}
.hero .trio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:15px}
.hero .trio div{border-radius:15px;padding:11px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.hero .trio small{display:block;font-size:10.5px;font-weight:800;letter-spacing:1px;color:var(--dim);text-transform:uppercase}
.hero .trio b{display:block;font-size:17px;font-weight:900;margin-top:4px;letter-spacing:-.5px}

/* sales intelligence */
.intel{
  border-radius:22px;padding:18px;
  background:linear-gradient(155deg,rgba(11,38,58,.8),rgba(8,11,17,.95));
  border:1px solid rgba(58,200,245,.3);box-shadow:0 0 34px rgba(58,200,245,.09);
}
.intel .ihead{display:flex;align-items:center;gap:8px}
.intel .ihead b{font-size:14px;font-weight:900;letter-spacing:1.5px;color:var(--emerald);text-transform:uppercase}
.intel .ihead .live{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--dim);letter-spacing:.7px}
.intel .ihead .live i{width:7px;height:7px;border-radius:50%;background:var(--emerald);box-shadow:0 0 8px var(--emerald)}
.intel .cap{margin:14px 0 0;font-size:12px;font-weight:800;letter-spacing:1.3px;color:var(--cyan);text-transform:uppercase}
.intel .big{font-size:43px;font-weight:900;letter-spacing:-2.2px;line-height:1.05;margin-top:4px}
.intel .sub{color:var(--dim);font-size:13.5px;margin-top:3px}

/* spark bars */
.spark{display:flex;align-items:flex-end;gap:4px;height:96px;margin-top:16px}
.spark .b{flex:1;border-radius:4px 4px 0 0;min-height:3px;background:linear-gradient(180deg,#4aa8ff,rgba(74,168,255,.28))}
.spark .b.hot{background:linear-gradient(180deg,var(--emerald),rgba(47,224,160,.3))}
.spark .b.neg{background:linear-gradient(180deg,var(--red),rgba(248,113,113,.28))}
.sparkends{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.sparkends span:first-child{color:var(--dim2)}.sparkends span:last-child{color:var(--cyan)}
.bars{display:flex;align-items:flex-end;gap:5px;height:120px;margin-top:14px}
.bars .b{flex:1;border-radius:5px 5px 0 0;min-height:3px;background:linear-gradient(180deg,var(--emerald),rgba(47,224,160,.28))}
.bars .b.neg{background:linear-gradient(180deg,var(--red),rgba(248,113,113,.28))}
.barlabels{display:flex;gap:5px;margin-top:8px}
.barlabels span{flex:1;font-family:var(--mono);font-size:8.5px;letter-spacing:-.4px;color:var(--dim2);text-align:center;overflow:visible;white-space:nowrap}
.infoline{display:flex;gap:8px;align-items:flex-start;margin-top:14px;color:var(--dim);font-size:12.5px;line-height:1.5}
.infoline em{font-style:normal;flex-shrink:0;opacity:.7}

/* segmented control */
.seg{display:flex;background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:15px;padding:4px;gap:4px}
.seg button{
  flex:1;border:0;background:none;color:var(--dim);border-radius:11px;cursor:pointer;
  font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;padding:10px 4px;
}
.seg button.on{
  background:rgba(58,200,245,.12);color:var(--cyan);
  box-shadow:0 2px 8px rgba(0,0,0,.35),0 0 16px rgba(58,200,245,.10),inset 0 0 0 1px rgba(58,200,245,.28);
}
svg.sic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.seg button svg.sic,.plane button svg.sic{width:12px;height:12px;vertical-align:-2px;margin-right:5px}

/* chips */
.chips{display:flex;gap:9px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--glass);color:var(--dim);border-radius:999px;padding:9px 15px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit}
.chip.on{border-color:rgba(58,200,245,.6);color:var(--cyan);background:rgba(58,200,245,.12)}

/* lists */
.list{display:flex;flex-direction:column;background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:18px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:14px 15px;border-bottom:1px solid var(--line2);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;color:var(--text);text-align:left;width:100%;font-family:inherit}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0}
.item .ttl{font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:12.5px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-size:15.5px;font-weight:800;text-align:right;white-space:nowrap}
.item .amt small{display:block;font-size:11px;font-weight:600;margin-top:3px}

/* customer cards */
.ccard{
  background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:20px;padding:15px;
  display:flex;flex-direction:column;gap:12px;
}
.ccard .top{display:flex;align-items:flex-start;gap:13px}
/* Ledger identity sigil. A circle with one letter in it is what every contacts
   app does, and on "1150854 Alberta Ltd." it rendered a meaningless "1". This is
   a chamfered HUD plate: 1px gradient edge, scanlines, circuit rail on the two
   square corners, mono designator, status tick in the notch. Mirrors LedgerSigil
   in CommandDashboardView.swift — keep the two in step. */
.ccard .ava{
  --sig:58,200,245;
  position:relative;width:56px;height:56px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
  background:linear-gradient(180deg,rgba(var(--sig),.9),rgba(var(--sig),.2));
  filter:drop-shadow(0 2px 7px rgba(var(--sig),.4));
}
.ccard .ava.ow{--sig:251,146,60}
.ccard .ava.od{--sig:248,113,113}
.ccard .ava::before{
  content:"";position:absolute;inset:1px;
  clip-path:polygon(15px 0,100% 0,100% calc(100% - 15px),calc(100% - 15px) 100%,0 100%,0 15px);
  background:
    repeating-linear-gradient(180deg,rgba(var(--sig),.16) 0 .5px,transparent .5px 3px),
    linear-gradient(140deg,rgba(var(--sig),.34),rgba(0,0,0,.72) 55%,rgba(var(--sig),.12));
}
.ccard .ava::after{
  content:"";position:absolute;top:3px;right:3px;width:32%;height:32%;
  border-top:1.4px solid rgba(var(--sig),.95);border-right:1.4px solid rgba(var(--sig),.95);
}
.ccard .ava .rail{
  position:absolute;bottom:3px;left:3px;width:32%;height:32%;
  border-bottom:1.4px solid rgba(var(--sig),.95);border-left:1.4px solid rgba(var(--sig),.95);
}
/* The tick lives on the wrapper, not inside .ava — the chamfer clip-path on
   .ava clips its own children, which swallowed the LED entirely. */
.ccard .avaw{position:relative;flex-shrink:0;width:56px;height:56px}
.ccard .avaw .tick{
  position:absolute;bottom:3px;right:3px;width:9px;height:9px;background:var(--emerald);z-index:2;
  box-shadow:0 0 6px var(--emerald);clip-path:polygon(2px 0,100% 0,100% calc(100% - 2px),calc(100% - 2px) 100%,0 100%,0 2px);
}
.ccard .avaw .tick.off{background:var(--dim);box-shadow:none}
.ccard .ava b{
  position:relative;z-index:1;font-family:var(--mono);font-weight:900;font-size:19px;color:#fff;
  text-shadow:0 0 8px rgba(var(--sig),.85);
}
.ccard .ava svg{position:relative;z-index:1;width:22px;height:22px;fill:#fff;filter:drop-shadow(0 0 6px rgba(var(--sig),.85))}
.ccard .who{flex:1;min-width:0;padding-top:2px}
.ccard .who b{display:block;font-size:19px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard .who span{display:block;font-size:13.5px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard .who i{display:block;font-style:normal;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.6px;color:var(--emerald);margin-top:5px;text-transform:uppercase}
.ccard .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actbtn{
  display:flex;align-items:center;justify-content:center;gap:7px;padding:12px;border-radius:14px;cursor:pointer;font-family:inherit;
  font-size:14.5px;font-weight:800;border:1px solid rgba(59,130,246,.42);background:rgba(59,130,246,.13);color:#7cb8ff;
}
.actbtn.p{border-color:rgba(168,85,247,.45);background:rgba(168,85,247,.14);color:#d09cff}

/* tags */
.tag{font-size:10px;font-weight:800;letter-spacing:.7px;padding:4px 8px;border-radius:7px;text-transform:uppercase}
.tag.open{background:rgba(251,146,60,.16);color:var(--orange)}
.tag.paid{background:rgba(47,224,160,.15);color:var(--emerald)}
.tag.due{background:rgba(248,113,113,.16);color:var(--red)}
.tag.new{background:rgba(58,200,245,.15);color:var(--cyan)}
.tag.grey{background:rgba(255,255,255,.07);color:var(--dim)}

.empty{color:var(--dim);font-size:14px;text-align:center;padding:38px 18px;line-height:1.65}
.skel{height:74px;border-radius:18px;background:linear-gradient(90deg,#0f141c,#182131,#0f141c);background-size:220% 100%;animation:sh 1.25s infinite}
@keyframes sh{0%{background-position:120% 0}100%{background-position:-120% 0}}

/* buttons */
.btn{border:0;border-radius:15px;padding:14px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;letter-spacing:.2px}
.btn.primary{background:linear-gradient(120deg,#3b82f6,#a855f7);color:#fff;box-shadow:0 10px 26px rgba(99,102,241,.32)}
.btn.ghost{background:var(--glass);color:var(--text);border:1px solid var(--line)}
.btn.em{background:linear-gradient(120deg,#2fe0a0,#38bdf8);color:#04241a;box-shadow:0 10px 26px rgba(47,224,160,.25)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.rowbtns{display:flex;gap:10px}
.rowbtns .btn{flex:1}
/* big CTA with icon tile, matches iOS CREATE INVOICE */
.cta{
  display:flex;align-items:center;gap:14px;width:100%;padding:16px;border:0;border-radius:20px;cursor:pointer;font-family:inherit;text-align:left;
  background:linear-gradient(115deg,#2563eb,#7c3aed 55%,#c026d3);color:#fff;box-shadow:0 14px 34px rgba(88,80,236,.34);
}
.cta .ic{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.cta b{display:block;font-size:18px;font-weight:900;letter-spacing:1.1px;text-transform:uppercase}
.cta span{display:block;font-size:13px;opacity:.86;margin-top:2px}
.cta.em{background:linear-gradient(115deg,#2fe0a0,#38bdf8);color:#04241a;box-shadow:0 14px 34px rgba(47,224,160,.28)}
.cta.blue{background:linear-gradient(115deg,#2563eb,#38bdf8)}

/* inputs */
input,select,textarea{
  background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:15px;color:var(--text);
  font-size:16px;padding:14px;outline:none;font-family:inherit;width:100%;
}
input::placeholder,textarea::placeholder{color:var(--dim2)}
input:focus,select:focus,textarea:focus{border-color:rgba(58,200,245,.5)}
label.fld{display:block;font-family:var(--mono);font-size:11px;color:var(--dim);font-weight:700;margin:13px 0 6px;letter-spacing:1.2px}
.searchwrap{position:relative}
.searchwrap input{padding-left:44px}
.searchwrap .mag{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--cyan);pointer-events:none;display:flex}
.searchwrap .mag svg{width:17px;height:17px;fill:currentColor}

/* phone tab */
.bignum{font-size:30px;font-weight:900;letter-spacing:-.8px;margin-top:8px;font-family:var(--mono);color:var(--cyan)}
.timerow{display:flex;gap:10px;align-items:center}
.timerow input{flex:1}
.daypick{display:flex;gap:7px}
.daybtn{flex:1;padding:10px 0;border-radius:11px;border:1px solid var(--line);background:var(--glass);color:var(--dim);font-weight:800;font-size:13px;cursor:pointer;font-family:inherit}
.daybtn.on{background:linear-gradient(120deg,#2fe0a0,#38bdf8);color:#04241a;border-color:transparent}

/* calendar */
.calstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.calstat{position:relative;border-radius:18px;padding:15px 12px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015))}
.calstat b{display:block;font-size:30px;font-weight:900;letter-spacing:-1.2px}
.calstat small{display:block;font-size:10px;font-weight:800;letter-spacing:.6px;color:var(--dim);text-transform:uppercase;margin-top:3px;white-space:nowrap}
.calstat i{position:absolute;top:14px;right:14px;width:8px;height:8px;border-radius:50%;display:block}
.nextup{
  display:flex;align-items:center;gap:14px;border-radius:20px;padding:16px;
  background:linear-gradient(115deg,rgba(16,140,116,.85),rgba(24,182,150,.6));border:1px solid rgba(47,224,160,.4);
}
.nextup .ic{width:50px;height:50px;border-radius:15px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.nextup .m{flex:1;min-width:0}
.nextup .m small{display:block;font-size:11px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;color:rgba(255,255,255,.85)}
.nextup .m b{display:block;font-size:18px;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nextup .m span{display:block;font-size:13px;color:rgba(255,255,255,.8);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nextup .go{width:36px;height:36px;border-radius:50%;background:#fff;color:#0c7a63;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}

button.nextup{width:100%;text-align:left;font-family:inherit;color:#fff;cursor:pointer}

/* ---------- calendar: month booking grid (iOS PremiumBookingCalendar) ---------- */
.bookcal{
  background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid rgba(58,200,245,.26);
  border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 0 30px rgba(58,200,245,.07);
}
.bchead{display:flex;align-items:flex-end;gap:10px}
.bchead b{display:block;font-size:18px;font-weight:800;margin-top:3px}
.bchead .nav{margin-left:auto;display:flex;gap:6px}
.bchead .nav button{
  background:rgba(58,200,245,.11);border:1px solid rgba(58,200,245,.3);color:var(--cyan);
  border-radius:10px;padding:6px 10px;font:inherit;font-size:13px;font-weight:800;cursor:pointer;
}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cgrid .dow{text-align:center;font-size:11px;font-weight:800;color:var(--dim2);padding-bottom:2px}
.cd{
  min-height:44px;border-radius:11px;border:1px solid rgba(255,255,255,.05);cursor:pointer;
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));
  color:var(--text);font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px 0;
}
.cd.empty{background:none;border:0;cursor:default}
.cd b{font-size:14.5px;font-weight:600}
.cd i{display:flex;gap:2px;height:4px}
.cd i u{width:3.5px;height:3.5px;border-radius:50%;background:var(--cyan);text-decoration:none}
.cd.now{border-color:rgba(58,200,245,.65);background:rgba(58,200,245,.09)}
.cd.now b{color:var(--cyan)}
.cd.on{background:linear-gradient(140deg,var(--cyan),var(--blue));border-color:transparent;box-shadow:0 3px 12px rgba(58,200,245,.45)}
.cd.on b{color:#04121b;font-weight:800}
.cd.on i u{background:#fff}
.bcfoot{display:flex;align-items:center;font-size:12.5px;font-weight:700;color:var(--dim)}
.bcfoot span:last-child{margin-left:auto;color:var(--dim2)}

/* ---------- calendar: book button + day schedule head ---------- */
.bookbtn{
  display:flex;align-items:center;gap:13px;width:100%;padding:14px;border-radius:18px;cursor:pointer;
  text-align:left;font-family:inherit;color:#fff;border:1px solid rgba(255,255,255,.22);
  background:linear-gradient(135deg,var(--cyan),#5933f2,var(--purple));
  box-shadow:0 8px 22px rgba(58,200,245,.28),0 12px 30px rgba(168,85,247,.2);
}
.bookbtn .ic{width:48px;height:48px;border-radius:13px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.bookbtn .m{flex:1;min-width:0}
.bookbtn .m b{display:block;font-size:16px;font-weight:900;letter-spacing:.4px}
.bookbtn .m span{display:block;font-size:12.5px;opacity:.82;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bookbtn .go{font-size:18px;flex-shrink:0}
.dayhead{display:flex;align-items:center;gap:9px;margin-top:4px}
.dayhead b{display:block;font-size:18px;font-weight:800;margin-top:3px}
.dayhead .rel{
  margin-left:auto;font-size:11px;font-weight:800;letter-spacing:1px;color:var(--emerald);
  background:rgba(47,224,160,.12);border:1px solid rgba(47,224,160,.3);border-radius:99px;padding:5px 10px;
}
.dayhead .cnt{
  font-size:17px;font-weight:800;color:var(--cyan);background:rgba(58,200,245,.13);
  border-radius:99px;padding:5px 13px;
}
.item.past{opacity:.6}
.empty.tapable{width:100%;font-family:inherit;font-size:inherit;color:var(--dim);cursor:pointer;background:none;border:1px dashed rgba(47,224,160,.35);border-radius:20px}

button.queue{width:100%;text-align:left;font-family:inherit;color:var(--text);cursor:pointer}
.hourpick{
  background:rgba(58,200,245,.1);border:1px solid rgba(58,200,245,.3);color:var(--cyan);
  border-radius:99px;padding:9px 12px;font:inherit;font-size:13px;font-weight:800;cursor:pointer;
}

/* receipts queue */
.queue{display:flex;align-items:center;gap:14px;border-radius:20px;padding:16px;border:1px solid rgba(47,224,160,.3);background:linear-gradient(160deg,rgba(10,48,38,.6),rgba(9,12,18,.94))}
.queue .ic{width:50px;height:50px;border-radius:15px;background:rgba(47,224,160,.16);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.queue .m{flex:1;min-width:0}
.queue .m small{display:block;font-size:12px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;color:var(--emerald)}
.queue .m b{display:block;font-size:20px;font-weight:900;margin-top:4px;letter-spacing:-.4px}
.queue .m span{display:block;font-size:12.5px;color:var(--dim);margin-top:3px;line-height:1.45}
.queue .chev{color:var(--dim2);font-size:19px}

/* warning strip */
.warnstrip{
  display:flex;gap:11px;align-items:flex-start;border-radius:18px;padding:15px;
  border:1px solid rgba(251,146,60,.42);background:rgba(251,146,60,.09);color:var(--orange);font-size:14px;font-weight:700;line-height:1.5;
}
.warnstrip em{font-style:normal;font-size:16px;flex-shrink:0}

/* ---------- floating tab capsule ---------- */
nav#tabs{
  position:absolute;left:14px;right:14px;bottom:calc(var(--bot) + 12px);z-index:22;
  display:flex;gap:2px;padding:7px;border-radius:30px;
  background:rgba(17,21,28,.93);border:1px solid rgba(255,255,255,.09);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  box-shadow:0 16px 40px rgba(0,0,0,.6);
}
nav#tabs button{
  flex:1;background:none;border:0;color:var(--dim2);font-size:10.5px;font-weight:700;
  padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;
  border-radius:22px;font-family:inherit;position:relative;letter-spacing:.1px;
}
nav#tabs button svg{width:21px;height:21px;fill:currentColor}
nav#tabs button.on{color:var(--cyan);background:rgba(255,255,255,.09)}
nav#tabs button .dot{position:absolute;top:5px;right:22%;width:8px;height:8px;border-radius:50%;background:var(--red)}

/* header chat entry — the floating orb is gone (Kyle, 2026-08-24: "take the
   orb out of all the tabs"); this is now the only way into Ask Ledger. */
.hchat{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;border:1px solid rgba(139,92,246,.4);cursor:pointer;
  background:radial-gradient(circle at 32% 28%,#c4b5fd,#8b5cf6 45%,#4f46e5);
  box-shadow:0 0 14px rgba(139,92,246,.45),inset 0 1px 0 rgba(255,255,255,.18);
  color:#fff;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;
}
.hchat svg{width:18px;height:18px;fill:currentColor}

/* ---------- chat ---------- */
#chatwrap{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:40}
#chatwrap.open{display:flex}
#chatwrap header{border-bottom:1px solid var(--line2)}
#chatwrap h1{text-align:left;font-size:17px}
.msg{max-width:86%;padding:12px 15px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word;line-height:1.5;font-size:15.5px}
.me{align-self:flex-end;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border-bottom-right-radius:6px}
.ai{align-self:flex-start;background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.err{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.4);color:var(--red)}
.sys{align-self:center;color:var(--dim2);font-size:12.5px;text-align:center;line-height:1.55;max-width:88%}
.card{align-self:flex-start;background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:18px;padding:15px;width:100%;max-width:430px}
.card h3{margin:0 0 5px;font-family:var(--mono);font-size:12px;letter-spacing:1.6px;color:var(--cyan);text-transform:uppercase}
.card .cust{font-weight:800;font-size:17px;margin-bottom:9px}
.card table{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:9px}
.card td{padding:4px 0;color:var(--dim)}.card td:last-child{text-align:right;color:var(--text)}
.card .total{font-weight:900;font-size:16px}
.row{display:flex;gap:9px;margin-top:11px}
.row .btn{flex:1}
.confirm{background:linear-gradient(120deg,#2fe0a0,#38bdf8);color:#04241a}
.cancel{background:rgba(255,255,255,.07);color:var(--dim)}
.emailrow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim);margin-top:7px}
.emailrow input{width:auto}
.rowbtns .emailrow{flex:1;min-width:0;flex-direction:column;align-items:stretch;gap:4px}
.rowbtns .emailrow input{width:100%;min-width:0}
footer{padding:11px 13px calc(var(--bot) + 13px);border-top:1px solid var(--line2);display:flex;gap:10px;align-items:flex-end;flex-shrink:0}
footer textarea{flex:1;border-radius:17px;padding:12px 14px;resize:none;max-height:120px;font-size:15.5px}
#send{width:46px;height:46px;border-radius:50%;border:0;background:linear-gradient(140deg,#38bdf8,#2563eb);color:#fff;font-size:20px;cursor:pointer;flex-shrink:0;box-shadow:0 6px 18px rgba(37,99,235,.4)}
#send:disabled{opacity:.4}
.typing{align-self:flex-start;color:var(--dim2);font-size:13px;padding:6px 14px}

/* ---------- sheets ---------- */
.sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:50;animation:fade .16s;backdrop-filter:blur(3px)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:600px;
  background:linear-gradient(170deg,#131922,#0a0e14);border:1px solid var(--line);border-radius:26px 26px 0 0;
  padding:18px 17px calc(var(--bot) + 18px);z-index:51;max-height:88dvh;overflow-y:auto;
  animation:up .22s cubic-bezier(.2,.8,.3,1);box-shadow:0 -20px 60px rgba(0,0,0,.7);
}
@keyframes up{from{transform:translate(-50%,26px);opacity:.4}to{transform:translate(-50%,0);opacity:1}}
.sheet h2{margin:0 0 4px;font-size:21px;font-weight:800;letter-spacing:-.4px}
.sheet .sh-sub{color:var(--dim);font-size:13.5px;margin:0 0 15px}
.sheet-close{width:100%;background:none;border:none;color:var(--dim);padding:13px;font-size:14px;cursor:pointer;font-family:inherit}
.grab{width:40px;height:4px;border-radius:99px;background:rgba(255,255,255,.16);margin:-8px auto 13px}
/* sticky keyboard escape hatch inside every sheet */
.kbbar{display:none}
#sheetwrap.kbon .kbbar{display:flex;justify-content:flex-end;position:sticky;top:-18px;z-index:3;
  margin:-13px -17px 10px;padding:8px 17px;background:linear-gradient(180deg,#131922 72%,rgba(19,25,34,0));
  backdrop-filter:blur(6px)}
.kbdone{border:1px solid rgba(58,200,245,.5);background:rgba(58,200,245,.14);color:var(--cyan);
  border-radius:999px;padding:7px 18px;font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:14.5px;border-bottom:1px solid rgba(255,255,255,.045)}
.kv span:first-child{color:var(--dim)}
.kv.tot{font-weight:900;font-size:16.5px;border-bottom:0;padding-top:11px}
/* VIN scanner — live camera overlay + one-skin spec card (2026-09-02) */
.vinrow{margin-top:10px;border-color:rgba(58,200,245,.3)}
.vinrow .ic svg{width:22px;height:22px;stroke:var(--cyan);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.vinrow small{color:var(--cyan)}
.vscan{position:fixed;inset:0;z-index:90;background:#000;display:flex;flex-direction:column;animation:fade .16s}
.vscan-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vscan-mask{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.vscan-frame{width:min(86vw,520px);height:150px;border-radius:18px;position:relative;box-shadow:0 0 0 100vmax rgba(0,0,0,.55);border:1.5px solid rgba(58,200,245,.7)}
.vscan-frame i{position:absolute;left:14px;right:14px;top:50%;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);box-shadow:0 0 14px var(--cyan);animation:vsweep 1.6s ease-in-out infinite}
.vscan-frame.hit{border-color:var(--emerald);box-shadow:0 0 0 100vmax rgba(0,0,0,.55),0 0 28px rgba(47,224,160,.6)}
.vscan-frame.hit i{background:var(--emerald);animation:none;box-shadow:0 0 14px var(--emerald)}
@keyframes vsweep{0%,100%{transform:translateY(-58px)}50%{transform:translateY(58px)}}
.vscan-top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:calc(var(--top) + 14px) 18px 12px}
.vscan-x{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;width:38px;height:38px;border-radius:50%;font-size:16px;cursor:pointer}
.vscan-hint{position:absolute;left:18px;right:18px;top:calc(50% + 96px);z-index:2;text-align:center;color:#fff;font-size:14.5px;font-weight:700;text-shadow:0 1px 8px #000}
.vscan-bot{position:absolute;left:18px;right:18px;bottom:calc(var(--bot) + 22px);z-index:2;display:flex;gap:10px;justify-content:center}
.vscan-bot .btn{background:rgba(0,0,0,.45);backdrop-filter:blur(8px)}
.vscan-torch.on{border-color:var(--gold);color:var(--gold)}
.speccard{margin-top:12px;border:1px solid rgba(58,200,245,.28);border-radius:20px;padding:14px;background:linear-gradient(160deg,rgba(58,200,245,.08),rgba(255,255,255,.02) 60%);box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06)}
.sc-head{display:flex;gap:12px;align-items:center}
.sc-ic{width:46px;height:46px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,#0284c7,#38bdf8);box-shadow:0 6px 18px rgba(58,200,245,.35)}
.sc-ic svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sc-title b{display:block;font-size:18px;font-weight:900;letter-spacing:-.3px}
.sc-title small{display:block;color:var(--dim);font-size:13px;margin-top:2px}
.sc-vin{font-family:var(--mono);font-size:12.5px;letter-spacing:2px;color:var(--cyan);margin-top:10px;word-break:break-all}
.sc-chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.sc-shop{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:7px;margin-top:11px}
.sc-tile{border:1px solid rgba(58,200,245,.3);background:rgba(58,200,245,.07);border-radius:14px;padding:10px 9px;display:flex;flex-direction:column;gap:3px;min-width:0}
.sc-tile span{font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim)}
.sc-tile b{font-size:16px;line-height:1.15;color:#fff;letter-spacing:-.3px;overflow-wrap:anywhere}
.sc-tile small{font-size:10.5px;color:var(--cyan);font-weight:700}
.sc-tile.off{border-color:var(--line);background:var(--glass)}
.sc-tile.off b{color:var(--dim)}
.sc-tile.off small{color:var(--dim);font-weight:600}
.sc-chip{border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:800;color:var(--dim)}
.sc-chip.em{border-color:rgba(47,224,160,.35);color:var(--emerald)}
.sc-chip.cy{border-color:rgba(58,200,245,.35);color:var(--cyan)}
.sc-warn{color:var(--gold);margin-top:8px}
.sc-all{margin-top:10px}
.sc-all summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px;padding:9px 0;border-top:1px solid rgba(255,255,255,.06)}
.sc-all summary::-webkit-details-marker{display:none}
.sc-all summary em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--cyan);border:1px solid rgba(58,200,245,.35);border-radius:999px;padding:2px 8px}
.sc-all summary::after{content:"\25BE";margin-left:auto;color:var(--dim);transition:transform .15s}
.sc-all[open] summary::after{transform:rotate(180deg)}
.sc-group{margin-top:8px}
.sc-group .eyebrow{margin:8px 0 2px}
.sc-group .kv{font-size:13.5px;padding:7px 0}
.sc-group .kv b{text-align:right;font-weight:700}
/* Profit sweep — "Match, don't move" (2026-09-05). One screen: what matched on
   its own, the few that need a look, what's waiting for a sale. */
.ms-auto{background:linear-gradient(150deg,rgba(12,44,36,.72),rgba(9,12,18,.95));border:1px solid rgba(47,224,160,.36);border-radius:22px;padding:17px;box-shadow:0 0 30px rgba(47,224,160,.08);margin-top:8px}
.ms-auto .headline{display:flex;align-items:baseline;gap:10px}
.ms-auto .headline .eyebrow{color:var(--emerald)}
.ms-auto .headline .when{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim2)}
.ms-auto .sum{font-size:15px;font-weight:700;margin:8px 0 0;line-height:1.45}
.ms-row{padding:10px 0;border-top:1px solid rgba(255,255,255,.06);font-size:13.5px;line-height:1.45}
.ms-row .top{display:flex;justify-content:space-between;gap:10px;font-weight:800}
.ms-row .to{color:var(--dim);margin-top:2px}
.ms-row .to b{color:var(--text)}
.ms-row .profit{color:var(--emerald);font-weight:800}
.ms-row .profit.neg{color:var(--red)}
.ms-row .linkbtn{margin:4px 0 0;padding:0}
.ms-card{background:var(--glass);border:1px solid rgba(251,191,36,.3);border-radius:20px;padding:15px;margin-top:10px}
.ms-card .head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ms-card .head b{font-size:16px}
.ms-card .head span{font-weight:900;font-size:16px;letter-spacing:-.3px}
.ms-card .meta{color:var(--dim);font-size:12.5px;margin-top:2px}
.ms-line{font-size:13px;color:var(--text);margin-top:5px;padding-left:10px;border-left:2px solid rgba(255,255,255,.12);line-height:1.4}
.ms-line em{font-style:normal;color:var(--dim);font-family:var(--mono);font-size:11.5px;margin-right:6px}
.ms-guess{margin-top:11px;padding:11px 12px;border-radius:14px;background:rgba(58,200,245,.08);border:1px solid rgba(58,200,245,.28);font-size:14px;line-height:1.45}
.ms-guess.none{background:rgba(255,255,255,.03);border-color:var(--line);color:var(--dim)}
.ms-guess .profit{color:var(--emerald);font-weight:800}
.ms-guess .profit.neg{color:var(--red)}
.ms-spare{margin-top:7px;padding-top:7px;border-top:1px dashed rgba(255,255,255,.14);color:var(--amber,#f0b429);font-weight:700}
.ms-sold{margin-top:7px;padding-top:6px;border-top:1px dashed rgba(255,255,255,.14)}
.ms-line.sale{display:flex;gap:8px;border-left-color:rgba(58,200,245,.45);font-size:12.5px;color:var(--dim)}
.ms-line.sale span{margin-left:auto;flex-shrink:0;font-family:var(--mono);font-size:11.5px}
.ms-line.sale.more{color:var(--dim);font-style:italic}
.ms-split{margin-top:10px;padding:11px 12px;border-radius:14px;background:rgba(240,180,41,.07);border:1px solid rgba(240,180,41,.35);font-size:13.5px;line-height:1.45}
.ms-split-title{font-weight:800;color:var(--amber,#f0b429)}
.ms-split-part{margin-top:8px;padding-top:6px;border-top:1px dashed rgba(255,255,255,.12)}
.ms-split-part .to{margin-top:4px;color:var(--text)}
.ms-split .btn.em.wide{margin-top:12px}
.ms-card .btn.wide{margin-top:8px}
.ms-card .btn.em.wide{margin-top:12px}
.ms-card .linkbtn{display:block;margin:10px auto 0;color:var(--dim)}
.ms-pick{margin-top:10px;border-top:1px solid rgba(255,255,255,.06)}
.ms-pick button.opt{display:flex;width:100%;gap:10px;align-items:baseline;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.05);padding:10px 2px;color:var(--text);font:inherit;font-size:13.5px;text-align:left;cursor:pointer}
.ms-pick button.opt b{font-family:var(--mono);font-size:12.5px;color:var(--cyan);flex-shrink:0}
.ms-pick button.opt span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-pick button.opt i{font-style:normal;color:var(--dim);font-size:12px;flex-shrink:0}
.ms-pick .ms-count-row{display:flex;width:100%;gap:10px;align-items:center;border-bottom:1px solid rgba(255,255,255,.05);padding:10px 2px;text-align:left}
.ms-pick .ms-count-row b{font-family:var(--mono);font-size:12.5px;color:var(--cyan);flex-shrink:0}
.ms-pick .ms-count-row span:first-of-type{flex:1;min-width:0;font-size:13px;color:var(--text);line-height:1.3}
.ms-pick .ms-step{display:flex;align-items:center;gap:6px;flex-shrink:0}
.ms-pick .ms-step i{font-style:normal;font-family:var(--mono);font-size:18px;font-weight:800;min-width:22px;text-align:center}
.ms-pick .stepbtn{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:var(--text);font-size:22px;line-height:1;font-weight:700}
.ms-pick .stepbtn:disabled{opacity:.3}
.ms-pick .ms-count-sum{margin:10px 0 8px;font-size:13px;color:var(--dim)}
.ms-pick .ms-count-sum b{color:var(--amber,#f0b429)}
.ms-pick button.opt:disabled{opacity:.5;cursor:default}
.ms-wait{margin-top:12px}
.ms-wait .ms-row .top{font-weight:700}
.pu-card{display:flex;align-items:center;gap:13px;width:100%;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;color:var(--text);font-size:15px;cursor:pointer;font-family:inherit}
.pu-card.hot{border-color:rgba(58,200,245,.55);background:rgba(58,200,245,.09)}
.pu-emoji{font-size:23px}.pu-info{flex:1;text-align:left;display:flex;flex-direction:column}.pu-info small{color:var(--dim);font-size:12.5px}
.pu-price{font-weight:900;color:var(--cyan);font-size:16px}

/* ---------- login / setup ---------- */
.login{margin:auto;text-align:center;padding:34px;max-width:380px;width:100%}
.login .mark{width:84px;height:84px;margin:0 auto 20px;font-size:38px;border-radius:24px}
.login h2{margin:0 0 7px;font-size:26px;font-weight:900;letter-spacing:-.6px}
.login p{color:var(--dim);font-size:14.5px;margin:0 0 24px;line-height:1.55}
.login input{margin-bottom:12px;text-align:center}
.login .btn{width:100%;background:linear-gradient(120deg,#3b82f6,#a855f7);color:#fff;padding:15px}
b{color:#fff}
a{color:var(--cyan)}
.duprow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--glass);font-size:13px}
.duprow small{color:var(--dim)}
.duprow .btn{flex-shrink:0;padding:7px 12px;font-size:12.5px}
.note{font-size:12.5px;color:var(--dim);line-height:1.55}
.note.err{color:var(--red)}
.note.ok{color:var(--emerald)}

/* ---------- in-sheet support chat ---------- */
.supchat-log{display:flex;flex-direction:column;gap:9px;max-height:46vh;overflow-y:auto;padding:2px 2px 4px;margin-bottom:10px}
.supchat-row{display:flex;gap:8px;align-items:flex-end}
.supchat-row textarea{flex:1;border-radius:17px;padding:11px 14px;resize:none;max-height:100px;font-size:14.5px}
.supchat-send{width:42px;height:42px;border-radius:50%;border:0;background:linear-gradient(140deg,#38bdf8,#2563eb);color:#fff;font-size:18px;cursor:pointer;flex-shrink:0}
.supchat-send:disabled{opacity:.4}
.supchat-ticket{display:flex;gap:9px;align-items:flex-start;margin-top:2px;padding:10px 11px;border:1px solid rgba(52,211,153,.35);background:rgba(52,211,153,.08);border-radius:11px;font-size:13px;color:var(--dim)}
.supchat-ticket b{color:var(--text)}
/* ---- build-43 parity: home Go To grid + settings row ---- */
.setupcard{margin-top:14px;padding:14px 15px;border-radius:18px;background:rgba(34,211,238,.06);border:1px solid rgba(34,211,238,.28)}
.setupstep{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.setupstep:first-of-type{border-top:0}
.setupstep .num{flex:0 0 30px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;background:rgba(255,255,255,.09)}

/* ==========================================================================
   iOS PARITY DESIGN LAYER (Kyle 1202, 2026-09-02) — the web app wears the same
   skin as the iPhone app. Mirrors CommandTheme + PhoneGlass + LedgerHomeToken
   from CameraAccess/Views/{CommandDashboardView,LedgerHomeView}.swift.
   Appended last so it wins over the older flat-card rules above.
   ========================================================================== */
:root{
  /* CommandTheme, converted from the SwiftUI Color literals. */
  --cyan:#0dabff;--emerald:#1ae694;--gold:#ffc238;--silver:#c2d1e6;
  --purple:#a855f7;--magenta:#e05cf0;--blue:#3b82f6;--red:#ff6b6b;--orange:#fb923c;
  --tone:13,171,255;              /* live atmosphere tone, JS swaps it */
  --r-card:22px;--r-tile:15px;--r-chip:12px;--gutter:16px;--sect:18px;--hair:1px;
}
/* ---------- living atmosphere: calm cyan, warm amber when something waits ---------- */
#root{background:#000;isolation:isolate}
#root::before,#root::after{
  content:"";position:fixed;pointer-events:none;z-index:0;
  border-radius:50%;filter:blur(70px);
}
#root::before{
  background:radial-gradient(closest-side,rgba(var(--tone),.62),rgba(var(--tone),.16) 55%,transparent 78%);
  width:150vw;height:70vh;top:-16vh;left:-38vw;animation:atmoA 26s ease-in-out infinite alternate;
}
#root::after{
  background:radial-gradient(closest-side,rgba(88,32,196,.55),rgba(88,32,196,.14) 55%,transparent 78%);
  width:140vw;height:66vh;top:40vh;left:-6vw;animation:atmoB 31s ease-in-out infinite alternate;
}
@keyframes atmoA{from{transform:translate3d(-4%,-3%,0) scale(1)}to{transform:translate3d(9%,6%,0) scale(1.12)}}
@keyframes atmoB{from{transform:translate3d(4%,3%,0) scale(1.05)}to{transform:translate3d(-8%,-5%,0) scale(.95)}}
@media (prefers-reduced-motion:reduce){#root::before,#root::after{animation:none}}
header,main,nav#tabs,#banner,#alertbar{position:relative;z-index:1}

/* ---------- PhoneGlass: the one card surface, everywhere ---------- */
.panel,.kpi,.gotile,.brandcard,.console,.phstrip,.glass{
  position:relative;
  background:
    linear-gradient(150deg,rgba(var(--gt,var(--tone)),.16),transparent 42%,rgba(var(--gt,var(--tone)),.06)),
    linear-gradient(160deg,rgba(20,26,36,.86),rgba(8,11,17,.92));
  border:1px solid transparent;
  border-radius:var(--r-card);
  background-clip:padding-box;
  box-shadow:0 10px 26px rgba(0,0,0,.34),0 4px 24px rgba(var(--gt,var(--tone)),.16);
  backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
}
.panel::before,.kpi::before,.gotile::before,.brandcard::before,.console::before,.phstrip::before,.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(150deg,rgba(255,255,255,.36),rgba(var(--gt,var(--tone)),.34) 45%,rgba(255,255,255,.03));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}
/* the specular edge — one crisp light along the top rim, same as iOS */
.panel::after,.kpi::after,.gotile::after,.brandcard::after,.console::after,.glass::after{
  content:"";position:absolute;inset:1px;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.40),rgba(255,255,255,.02) 46%,transparent 52%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;padding:1px;
}
.panel.quiet,.kpi{box-shadow:0 6px 18px rgba(0,0,0,.24)}
.panel.cy{--gt:13,171,255}.panel.em{--gt:26,230,148}.panel.pu{--gt:168,85,247}
.panel.gd{--gt:255,194,56}.panel.rd{--gt:255,107,107}.panel.or{--gt:251,146,60}
.panel.pk{--gt:244,114,182}

.srail .rw{display:flex;align-items:center;gap:9px}

/* ---------- LedgerPulseTile: instrument numerals on a gradient rail ---------- */
.ptiles{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.ptile{
  position:relative;min-height:100px;padding:12px;border-radius:var(--r-tile);
  display:flex;flex-direction:column;gap:7px;text-align:left;
  background:
    linear-gradient(150deg,rgba(var(--gt),.10),transparent 45%),
    linear-gradient(160deg,rgba(20,26,36,.8),rgba(8,11,17,.9));
  box-shadow:0 6px 18px rgba(0,0,0,.24);
  border:1px solid transparent;background-clip:padding-box;
  font-family:inherit;color:var(--text);cursor:default;
}
.ptile::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(150deg,rgba(255,255,255,.30),rgba(var(--gt),.20) 45%,rgba(255,255,255,.03));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}
.ptile .h{display:flex;align-items:center;gap:7px}
.ptile .h i{
  width:21px;height:21px;border-radius:6px;flex-shrink:0;font-style:normal;
  display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;
  background:linear-gradient(140deg,rgba(var(--gt),.9),rgba(var(--gt),.5));

  font-size:23px;font-weight:900;letter-spacing:-.7px;line-height:1.05;
  background:linear-gradient(180deg,#fff,rgba(var(--gt),.75));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px rgba(var(--gt),.4));
}
.ptile em{font-style:normal;font-size:11.5px;line-height:1.35;color:rgb(var(--gt));display:block}
.ptile .rail{height:2.5px;border-radius:999px;margin-top:auto;
  background:linear-gradient(90deg,rgba(var(--gt),.85),rgba(var(--gt),.15) 55%,transparent)}
.ptile.na b{background:none;color:var(--dim);-webkit-text-fill-color:var(--dim);filter:none}
.ptile.na em{color:var(--orange)}
.ptile.cy{--gt:13,171,255}.ptile.em{--gt:26,230,148}.ptile.pu{--gt:168,85,247}
.ptile.gd{--gt:255,194,56}.ptile.rd{--gt:255,107,107}.ptile.or{--gt:251,146,60}
.ptile.pk{--gt:244,114,182}.ptile.bl{--gt:59,130,246}

/* ---------- LedgerPreviewCard: rail + rows + full-width gradient CTA ---------- */
.pvcard{display:flex;flex-direction:column;gap:12px;padding:16px}
.pvline{display:flex;align-items:center;gap:10px}
.pvline .pic{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
