<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger AI">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ledger AI</title>
<style>
:root{--bg:#0b0f14;--card:#141a22;--card2:#101720;--line:#232c37;--text:#f3f5f7;--dim:#9aa6b2;--cyan:#22d3ee;--purple:#a855f7;--emerald:#34d399;--gold:#fbbf24;--red:#f87171;--orange:#fb923c;--top:env(safe-area-inset-top);--bot:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior-y:none}
body{background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column}
#root{display:flex;flex-direction:column;height:100dvh;max-width:760px;margin:0 auto;width:100%;position:relative}
header{display:flex;align-items:center;gap:10px;padding:calc(var(--top) + 12px) 16px 12px;border-bottom:1px solid var(--line);flex-shrink:0}
.mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,rgba(34,211,238,.25),rgba(168,85,247,.22));display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--cyan);border:1px solid rgba(34,211,238,.4);flex-shrink:0;overflow:hidden}
.mark img{width:100%;height:100%;object-fit:cover}
h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--dim);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;user-select:none;white-space:nowrap}
.pill.on{color:var(--emerald);border-color:var(--emerald);background:rgba(52,211,153,.12)}
#usage{font-size:11px;color:var(--dim);padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.04);white-space:nowrap}
#banner{display:none;background:rgba(52,211,153,.1);color:var(--emerald);font-size:12px;padding:7px 16px}
#alertbar{display:none;background:rgba(251,146,60,.12);color:var(--orange);font-size:12px;padding:7px 16px}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;display:flex;flex-direction:column;gap:12px}
main.chatpane{padding:16px}
/* ---- tab bar ---- */
nav#tabs{display:flex;border-top:1px solid var(--line);background:var(--card2);padding-bottom:var(--bot);flex-shrink:0}
nav#tabs button{flex:1;background:none;border:0;color:var(--dim);font-size:10px;font-weight:700;padding:9px 2px 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;letter-spacing:.3px}
nav#tabs button .ic{font-size:19px;line-height:1}
nav#tabs button.on{color:var(--cyan)}
nav#tabs button .dot{position:absolute;transform:translate(14px,-4px);width:8px;height:8px;border-radius:50%;background:var(--red)}
/* ---- generic surfaces ---- */
.sect{display:flex;flex-direction:column;gap:11px}
.eyebrow{font-size:11px;letter-spacing:1.6px;font-weight:800;color:var(--cyan);margin:2px 0 -4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.panel h3{margin:0 0 3px;font-size:16px}
.panel p.sub{margin:0;color:var(--dim);font-size:13px;line-height:1.5}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px}
.kpi small{display:block;color:var(--dim);font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase}
.kpi b{display:block;font-size:22px;font-weight:800;margin-top:4px;letter-spacing:-.5px}
.kpi.wide{grid-column:1/-1}
.kpi.cyan b{color:var(--cyan)}.kpi.gold b{color:var(--gold)}.kpi.em b{color:var(--emerald)}.kpi.orange b{color:var(--orange)}
.hero{background:linear-gradient(160deg,#151c26,#10151c);border:1px solid rgba(34,211,238,.3);border-radius:20px;padding:18px}
.hero .big{font-size:32px;font-weight:900;letter-spacing:-1px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{border-color:var(--cyan);color:var(--cyan);background:rgba(34,211,238,.1)}
.list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;gap:11px;padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;color:var(--text);text-align:left;width:100%;font-family:inherit}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0}
.item .ttl{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:12px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-size:15px;font-weight:700;text-align:right;white-space:nowrap}
.item .amt small{display:block;font-size:11px;font-weight:600;margin-top:2px}
.tag{font-size:10px;font-weight:800;letter-spacing:.6px;padding:3px 7px;border-radius:6px;text-transform:uppercase}
.tag.open{background:rgba(251,146,60,.16);color:var(--orange)}
.tag.paid{background:rgba(52,211,153,.14);color:var(--emerald)}
.tag.due{background:rgba(248,113,113,.16);color:var(--red)}
.tag.new{background:rgba(34,211,238,.14);color:var(--cyan)}
.tag.grey{background:rgba(255,255,255,.07);color:var(--dim)}
.empty{color:var(--dim);font-size:14px;text-align:center;padding:34px 18px;line-height:1.6}
.skel{height:66px;border-radius:16px;background:linear-gradient(90deg,#141a22,#1b2330,#141a22);background-size:220% 100%;animation:sh 1.2s infinite}
@keyframes sh{0%{background-position:120% 0}100%{background-position:-120% 0}}
.btn{border:0;border-radius:12px;padding:12px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.btn.primary{background:linear-gradient(135deg,var(--cyan),var(--purple));color:#fff}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--line)}
.btn.em{background:var(--emerald);color:#07211a}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.rowbtns{display:flex;gap:8px}
.rowbtns .btn{flex:1}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--text);font-size:16px;padding:12px;outline:none;font-family:inherit;width:100%}
label.fld{display:block;font-size:12px;color:var(--dim);font-weight:700;margin:10px 0 5px;letter-spacing:.4px}
/* ---- bars (profit) ---- */
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:12px}
.bars .b{flex:1;background:linear-gradient(180deg,var(--cyan),rgba(34,211,238,.25));border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars .b.neg{background:linear-gradient(180deg,var(--red),rgba(248,113,113,.25))}
.barlabels{display:flex;gap:4px;margin-top:6px}
.barlabels span{flex:1;font-size:9px;color:var(--dim);text-align:center;overflow:hidden;white-space:nowrap}
/* ---- chat ---- */
#chatwrap{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:30}
#chatwrap.open{display:flex}
.msg{max-width:86%;padding:11px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word;line-height:1.45;font-size:15px}
.me{align-self:flex-end;background:linear-gradient(135deg,#0e7490,#155e75);color:#fff;border-bottom-right-radius:5px}
.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.sys{align-self:center;color:var(--dim);font-size:12px;text-align:center;line-height:1.5}
.card{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;width:100%;max-width:420px}
.card h3{margin:0 0 4px;font-size:13px;letter-spacing:1px;color:var(--cyan)}
.card .cust{font-weight:700;font-size:16px;margin-bottom:8px}
.card table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:8px}
.card td{padding:3px 0;color:var(--dim)}.card td:last-child{text-align:right;color:var(--text)}
.card .total{font-weight:800;font-size:15px}
.row{display:flex;gap:8px;margin-top:10px}
.row .btn{flex:1}
.confirm{background:var(--emerald);color:#07211a}.cancel{background:rgba(255,255,255,.08);color:var(--dim)}
.emailrow{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);margin-top:6px}
.emailrow input{width:auto}
footer{padding:10px 12px calc(var(--bot) + 12px);border-top:1px solid var(--line);display:flex;gap:9px;align-items:flex-end;flex-shrink:0}
footer textarea{flex:1;border-radius:14px;padding:11px 13px;resize:none;max-height:120px;font-size:15px}
#send{width:44px;height:44px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#fff;font-size:19px;cursor:pointer;flex-shrink:0}
#send:disabled{opacity:.4}
.typing{align-self:flex-start;color:var(--dim);font-size:13px;padding:6px 14px}
/* ---- sheets ---- */
.sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.64);z-index:40;animation:fade .16s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:600px;background:var(--card);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 16px calc(var(--bot) + 16px);z-index:41;max-height:88dvh;overflow-y:auto;animation:up .22s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translate(-50%,26px);opacity:.4}to{transform:translate(-50%,0);opacity:1}}
.sheet h2{margin:0 0 3px;font-size:19px}
.sheet .sh-sub{color:var(--dim);font-size:13px;margin:0 0 14px}
.sheet-close{width:100%;background:none;border:none;color:var(--dim);padding:12px;font-size:14px;cursor:pointer;font-family:inherit}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:-8px auto 12px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:14px;border-bottom:1px solid rgba(255,255,255,.04)}
.kv span:first-child{color:var(--dim)}
.kv.tot{font-weight:800;font-size:16px;border-bottom:0;padding-top:10px}
.pu-card{display:flex;align-items:center;gap:12px;width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:9px;color:var(--text);font-size:15px;cursor:pointer;font-family:inherit}
.pu-card.hot{border-color:var(--cyan);background:rgba(34,211,238,.08)}
.pu-emoji{font-size:22px}.pu-info{flex:1;text-align:left;display:flex;flex-direction:column}.pu-info small{color:var(--dim);font-size:12px}
.pu-price{font-weight:800;color:var(--cyan);font-size:16px}
/* ---- login / setup ---- */
.login{margin:auto;text-align:center;padding:32px;max-width:360px;width:100%}
.login .mark{width:74px;height:74px;margin:0 auto 18px;font-size:34px;border-radius:20px}
.login h2{margin:0 0 6px}.login p{color:var(--dim);font-size:14px;margin:0 0 22px;line-height:1.5}
.login input{margin-bottom:11px}
.login .btn{width:100%;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#fff;padding:14px}
.fab{position:absolute;right:16px;bottom:calc(var(--bot) + 74px);width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#fff;font-size:23px;cursor:pointer;box-shadow:0 10px 30px rgba(34,211,238,.32);z-index:20}
b{color:#fff}
a{color:var(--cyan)}
.note{font-size:12px;color:var(--dim);line-height:1.5}
.note.err{color:var(--red)}
.note.ok{color:var(--emerald)}
</style>
</head>
<body><div id="root"></div>
<script type="module" src="app.js"></script>
</body></html>
